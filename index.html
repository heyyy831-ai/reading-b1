<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文法理解ベースのリーディング B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>

  :root{
    color-scheme:light;
    --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
    --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
    --red:#C0412F; --red-soft:#F9E3DF; --gold:#E9C46A; --hl:#FFF0B8; --hl-line:#E9C46A;
    --en:"Crimson Pro","Georgia","Times New Roman",serif;
    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --red:#F08A78; --red-soft:#3A2220; --gold:#E9C46A; --hl:#4A3F17; --hl-line:#C9A443;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px}

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
  .nav-in{max-width:860px;margin:0 auto;padding:8px 18px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .nav a{flex:none;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap}
  .nav a:hover{color:var(--ink);background:var(--soft)}
  .nav a.on{background:var(--navy);color:var(--paper)}
  .theme{margin-left:auto;flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}

  /* header */
  header{padding:30px 0 14px}
  .kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
  .badge{background:var(--navy);color:#fff;border-radius:6px;padding:6px 12px;line-height:1.1;text-align:center;font-weight:700}
  :root[data-theme="dark"] .badge{color:#13171E}
  .badge small{display:block;font-size:9.5px;letter-spacing:.12em;opacity:.85}
  .badge b{font-size:22px;font-family:var(--en)}
  .tag{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
  .tag.t1{background:var(--orange);color:#fff}
  .tag.t2{background:var(--soft);color:var(--ink-2);border:1px solid var(--rule)}
  h1{font-family:var(--en);font-weight:700;color:var(--navy);font-size:clamp(28px,5vw,38px);line-height:1.18;margin:14px 0 4px}
  .sub{color:var(--ink-2);font-size:14px;margin:0}

  .card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:22px clamp(16px,4vw,30px);margin-top:18px}
  .illus{display:block;width:100%;height:auto;border-radius:12px}
  :root[data-theme="dark"] .illus{filter:brightness(.92)}
  section{scroll-margin-top:60px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:34px 0 6px}
  .sec-h .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
  .sec-h h2{margin:0;font-size:18px}
  .sec-h .note{margin-left:auto;color:var(--ink-3);font-size:12px}
  .lead{color:var(--ink-2);font-size:13.5px;margin:4px 0 0}

  /* reading */
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);background:none;border:0;padding:0}
  .switch .knob{width:34px;height:20px;border-radius:99px;background:var(--rule);position:relative;transition:background .2s}
  .switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .switch[aria-pressed="true"] .knob{background:var(--navy)}
  .switch[aria-pressed="true"] .knob::after{left:16px}
  .para{display:flex;gap:12px;margin:14px 0}
  .pno{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:6px}
  .para p{margin:0;font-family:var(--en);font-size:clamp(17px,2.4vw,19.5px);line-height:1.75;text-align:justify;hyphens:auto}
  .gp{font-weight:700}
  .show-gp .gp{color:var(--navy);background:linear-gradient(var(--gold),var(--gold)) 0 100%/100% 2.5px no-repeat;padding-bottom:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .s{transition:background .3s;border-radius:3px}
  .s.ev{background:var(--hl);box-shadow:0 0 0 2px var(--hl);animation:pulse 1.4s ease 1}
  @keyframes pulse{0%{box-shadow:0 0 0 6px var(--hl-line)}100%{box-shadow:0 0 0 2px var(--hl)}}

  /* media */
  .media{display:grid;grid-template-columns:1fr;gap:16px}
  .media h3{margin:0 0 8px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  audio{width:100%}
  .rate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rate button{border:1px solid var(--rule);background:var(--soft);color:var(--ink-2);border-radius:99px;padding:3px 12px;font-size:12.5px}
  .rate button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ytlink{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--orange)}

  /* translation */
  details.tr{background:var(--soft);border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:0}
  details.tr summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:8px}
  details.tr summary::-webkit-details-marker{display:none}
  details.tr summary::after{content:"＋ 開く";margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}
  details.tr[open] summary::after{content:"－ 閉じる"}
  .tr-body{padding:0 18px 16px}
  .tr-body p{margin:0 0 10px;text-indent:1em;font-size:14.5px;color:var(--ink-2)}

  /* grammar items */
  .gi{border-top:1px solid var(--rule);padding:18px 0 6px;scroll-margin-top:70px;transition:background .4s}
  .gi:first-child{border-top:0;padding-top:4px}
  .gi.flash{background:var(--orange-soft);border-radius:10px}
  .gi h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:16px;color:var(--navy)}
  .gi h3 .n{width:24px;height:24px;border:1.5px solid var(--navy);border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
  .gi .lbl{color:var(--orange);font-weight:700;font-size:13px}
  .gi p{margin:4px 0;font-size:14.5px}
  .gi .en{font-family:var(--en);font-size:16px}
  .ex{background:var(--soft);border-left:3px solid #A8BBD6;border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0;font-size:14px}
  .ex .en{font-size:16.5px}

  /* grammar check */
  .gq{font-family:var(--en);font-size:clamp(17px,2.4vw,19px);line-height:2.4}
  .gq p{margin:0 0 12px;text-indent:1.2em}
  .blank{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;line-height:1;background:var(--soft);border:1px solid var(--rule);border-radius:99px;padding:2px 3px 2px 8px;margin:0 2px;font-family:var(--jp)}
  .blank .no{font-size:11px;color:var(--orange);font-weight:700;margin-right:2px}
  .blank button{border:0;background:transparent;color:var(--ink-2);border-radius:99px;padding:3px 8px;font-size:13px;font-family:var(--en);font-weight:600}
  .blank button:hover{background:var(--paper);color:var(--ink)}
  .blank button.pick{background:var(--navy);color:var(--paper)}
  .blank.ok{border-color:var(--green);background:var(--green-soft)}
  .blank.ok button.pick{background:var(--green)}
  .blank.ng{border-color:var(--red);background:var(--red-soft)}
  .blank.ng button.pick{background:var(--red)}
  .blank .mark{font-size:13px;font-weight:700;padding:0 4px}
  .blank.ok .mark{color:var(--green)} .blank.ng .mark{color:var(--red)}
  .gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
  .score{font-weight:700;font-size:14px}
  .score b{color:var(--orange);font-size:18px;font-family:var(--en)}
  .btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700}
  .btn:hover{color:var(--ink);border-color:var(--ink-3)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .alist{margin:6px 0 0;padding:0;list-style:none}
  .alist li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px dashed var(--rule)}
  .alist .num{width:26px;height:22px;border-radius:5px;background:var(--gold);color:#3b2f10;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .alist .ans{font-weight:700;color:var(--navy)}
  .alist .ans .res{font-size:12px;margin-left:8px;font-weight:700}
  .alist .res.ok{color:var(--green)} .alist .res.ng{color:var(--red)}
  .alist .exp{grid-column:2;font-size:13.5px;color:var(--ink-2);margin:0}
  .alist li[hidden]{display:none}
  .golink{border:0;background:none;color:var(--orange);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
  .jt{margin-top:14px;font-size:14px;color:var(--ink-2)}
  .jt p{margin:0 0 8px;text-indent:1em}

  /* reading quiz */
  .rq{border-top:1px solid var(--rule);padding:20px 0 6px}
  .rq:first-of-type{border-top:0;padding-top:4px}
  .rq .qh{display:flex;gap:10px;align-items:flex-start}
  .rq .qn{flex:none;background:var(--navy);color:var(--paper);border-radius:6px;font-weight:700;font-size:13px;padding:2px 9px;margin-top:4px}
  .rq .qtext{font-family:var(--en);font-size:clamp(17px,2.3vw,18.5px);line-height:1.6;margin:0}
  .rq .qja{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
  .opts{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font-family:var(--en);font-size:clamp(16px,2.2vw,17.5px);line-height:1.5;transition:border-color .15s,background .15s}
  .opt:hover:not([disabled]){border-color:var(--ink-3)}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:12px;font-family:var(--jp);font-weight:700;margin-top:2px}
  .opt[disabled]{cursor:default}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.correct .k{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
  .fb{margin-top:12px;border-radius:12px;padding:14px 16px;background:var(--soft);font-size:14px}
  .fb[hidden]{display:none}
  .fb .v{font-weight:700;font-size:15px;margin:0 0 6px}
  .fb .v.ok{color:var(--green)} .fb .v.ng{color:var(--red)}
  .fb .evid{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:8px 0}
  .fb .evid .en{font-family:var(--en);font-size:16.5px;line-height:1.55}
  .fb .evid .ja{font-size:13px;color:var(--ink-2);display:block;margin-top:2px}
  .fb ul{margin:8px 0 0;padding-left:0;list-style:none}
  .fb li{margin:5px 0;padding-left:28px;position:relative}
  .fb li .k{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:700}
  .fb li.right .k{background:var(--green);border-color:var(--green);color:#fff}
  .tobody{margin-top:8px}
  .rscore{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule)}

  /* 読解クイズ：本文を横に並べる */
  .wide{width:min(1180px,calc(100vw - 36px));margin-left:calc((100% - min(1180px,calc(100vw - 36px))) / 2)}
  .rq-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-top:10px}
  .rq-pass{display:none}
  .rp-h{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3)}
  .rp-para{display:flex;gap:10px;margin:0 0 14px;border-radius:10px;padding:6px 8px;transition:opacity .25s,background .25s}
  .rp-para p{margin:0;font-family:var(--en);font-size:16.5px;line-height:1.65}
  .rp-para .pno{margin-top:3px}
  .rq-pass.focus .rp-para{opacity:.38}
  .rq-pass.focus .rp-para.cur{opacity:1;background:var(--paper);box-shadow:0 0 0 1px var(--rule)}
  .rq-ctx{margin:12px 0 0;background:var(--soft);border-radius:12px;border:1px solid var(--rule)}
  .rq-ctx summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px}
  .rq-ctx summary::-webkit-details-marker{display:none}
  .rq-ctx summary::after{content:"閉じる";margin-left:auto;font-weight:500;color:var(--ink-3)}
  .rq-ctx:not([open]) summary::after{content:"開く"}
  .rq-ctx .rp-para{padding:0 12px;margin:0 0 12px}
  .hide-ja .qja{display:none}
  @media (min-width:1000px){
    .rq-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
    .rq-pass{display:block;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;background:var(--soft);border-radius:14px;padding:14px 14px 4px;border:1px solid var(--rule)}
    .rq-ctx{display:none}
  }
  footer{margin-top:40px;color:var(--ink-3);font-size:12px;text-align:center}
  @media (max-width:560px){ .para{gap:8px} .card{border-radius:12px} }

  /* Part 切り替え */
  .chapbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:18px 0 0}
  .ctab{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;min-width:38px;height:34px;padding:0 12px;font-weight:700;font-size:14px;cursor:pointer}
  .ctab[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
  .ctab:hover:not([aria-pressed="true"]){border-color:var(--ink-3)}
  .chapbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .partbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 0}
  @media (max-width:640px){
    .partbar .lbl2{display:none}
    .partbar{gap:6px}
    .ptab{padding:6px 10px}
    .partbar .ptab span{display:none}
    .partbar .ptab{min-width:0;flex:0 0 auto}
  }
  .partbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .ptab{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.3;min-width:0}
  .ptab b{display:block;font-size:13px;color:var(--ink)}
  .ptab span{display:block;font-size:11.5px;font-family:var(--en);max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .ptab[aria-selected="true"] b{color:var(--paper)}
  .ptab:hover:not([aria-selected="true"]){border-color:var(--ink-3)}
  .alist .exp .golink{margin-right:4px}
  #gq p{margin:0 0 12px;line-height:2.1;text-indent:0}
  .blank .sl{color:var(--ink-3);font-size:12px}
  .nextpart{display:flex;justify-content:flex-end;margin-top:26px}
</style>
</head>
<body>
<nav class="nav" aria-label="セクション">
  <div class="nav-in">
    <a href="#reading">本文</a>
    <a href="#media">音声・動画</a>
    <a href="#trans">全訳</a>
    <a href="#grammar">文法解説</a>
    <a href="#gcheck">文法チェック</a>
    <a href="#rquiz">読解クイズ</a>
    <button class="theme" id="themeBtn" type="button" aria-pressed="false">ダーク</button>
  </div>
</nav>

<div class="wrap">
  <div class="chapbar" id="chapbar" aria-label="PART を選ぶ"></div>
  <div class="partbar" role="tablist" aria-label="Lesson を選ぶ" id="partbar"></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script>
const OPTS4 = ["a", "an", "the", "×"];
const LESSONS = [

 "id": "1-1",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 1-1では文の基本要素とbe動詞のあるセンテンスの文型を扱います。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>主語 (S) と述部</h3>\n<p><span class=\"lbl\">ポイント：</span>英語の文は「誰が/何が (主語)」と「どうだ/どうする (述部)」で成り立っています。</p>\n<div class=\"ex\">Mathematics is difficult for me. (数学は私にとって難しい。)</div>\n<div class=\"ex\">The blue sky is beautiful. (青い空は美しい。)</div>\n<p><span class=\"lbl\">ポイント：</span>Lesson 1-1では特に<b>be動詞</b>を用いた「A (主語) = B (名詞補語)」または「A (主語) = どんな状態 (形容詞補語)」の文を扱います。</p>\n<div class=\"ex\">Tom is <b>a doctor</b>. (トムはお医者さんです。 - 名詞補語)</div>\n<div class=\"ex\">Jamie is <b>pretty</b>. (ジェイミーはきれいです。 - 形容詞補語)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>文中の名詞・代名詞の働き</h3>\n<p><span class=\"lbl\">ポイント１：</span>名詞は主語や補語になります。</p>\n<div class=\"ex\"><b>Doctors</b> are busy. (医者は忙しい。)</div>\n<div class=\"ex\">They are <b>friends</b>. (彼らは友人です。)</div>\n<p><span class=\"lbl\">ポイント２：</span>代名詞は名詞の代わりに使われます（I, we, you, he, she, it, theyなど）。</p>\n<div class=\"ex\"><b>They</b> are in the hospital. (彼らは病院にいます。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>文中の形容詞・冠詞の働き</h3>\n<p><span class=\"lbl\">ポイント１：</span>形容詞は名詞の状態や性質を説明します（補語になる用法）。</p>\n<div class=\"ex\">The soup is <b>hot</b>. (そのスープは熱い。)</div>\n<p><span class=\"lbl\">ポイント２：</span>冠詞(a/an, the)は名詞の前に付きます。aは「一つの」「ある〜」で、theは聞き手に分かる「例の〜」です。</p>\n<div class=\"ex\">There is <b>a</b> cat in <b>the</b> room. <b>The</b> cat is so cute. (猫が部屋にいますよ。その猫はとてもかわいいです)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>文中の副詞の働き</h3>\n<p><span class=\"lbl\">ポイント：</span>副詞は動詞、形容詞、他の副詞、または文全体を修飾します。場所や時、程度を表します。</p>\n<div class=\"ex\">I usually eat <b>at home</b> on weekdays. (平日は大体うちで食べてます。 - 場所を表す副詞句が動詞を修飾)</div>\n<div class=\"ex\">She is <b>very</b> kind. (彼女はとても親切だ。 - 形容詞を修飾)</div>\n<div class=\"ex\">She is <b>right</b> there. (彼女は正に向こうにいる。- 他の副詞を修飾)</div>\n<div class=\"ex\"><b>Honestly</b>, I'm surprised. (正直、僕は驚いている。- 文全体を修飾)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>文中の動詞の働き (be動詞)</h3>\n<p><span class=\"lbl\">ポイント：</span>be動詞 (am, is, are) は主語の状態や属性を説明し、イコール（＝）の関係を作ります。主語によって使い分けます。</p>\n<div class=\"ex\"><b>I am</b> a student. (私は学生です。)</div>\n<div class=\"ex\"><b>He is</b> tired. (彼は疲れています。)</div>\n<div class=\"ex\"><b>We are</b> happy. (私たちは幸せです。)</div>\n</div>",

  "今日、日本のカレーは独特です。それは一般的に、インドやタイのカレーよりも濃厚で甘いのです。その濃厚なソースは、粘り気のある白米と完璧に合います。また、国中に様々な地域ごとの種類があります。例えば、札幌の「スープカレー」は有名です。それは、よりあっさりしていてスパイシーです。一方で、「金沢カレー」は色が濃く、千切りキャベツと共に提供されます。これらの異なるスタイルは、カレーがいかに深く日本文化に統合されたかを示しています。これはもはや単なる外国料理ではありません。それは私たちの国にとっての真のソウルフード（慣れ親しんだ食べ物）なのです。"

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 1-2 で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>指示代名詞</h3>\n<p><span class=\"lbl\">ポイント：</span>「これ」「それ」「あれ」などを指す代名詞です。単数と複数で形が変わります。物理的な距離だけでなく、心理的な距離や、話に出てきた順番なども表します。例文のようにthis, thatの使い方に注意。</p>\n<div class=\"ex\">Is <b>this</b> the Hilton Hotel? <b>This</b> is Ken Yamamoto. ((電話で)ヒルトンホテルさんですか？こちらは山本謙ですが。)</div>\n<div class=\"ex\"><b>This</b> is my friend, Tom. (こちらは私の友人のトムです。)</div>\n<div class=\"ex\">Are you going to marry <b>that</b>? (あんなのと結婚すんの？)</div>\n<div class=\"ex\"><b>These</b> are very useful. (これらはとても役に立ちます。)</div>\n<div class=\"ex\"><b>Those</b> are dangerous chemicals. (あれらは危険な化学薬品です。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>人称代名詞の所有格</h3>\n<p><span class=\"lbl\">ポイント：</span>名詞の前に置き、「誰の〜」を表します。形容詞のように働きます。my, your, his, her, its, our, their があります。</p>\n<div class=\"ex\">Please clean <b>your</b> room. (あなたの部屋を掃除して下さい。)</div>\n<div class=\"ex\">He goes to <b>his</b> office by train. (彼は会社には電車で通っています)</div>\n<div class=\"ex\">The cat licked <b>its</b> paw. (その猫は自分の足をなめた。)</div>\n<div class=\"ex\">Is that <b>their</b> house? (あれは彼らの家ですか？)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>名詞を直接修飾する形容詞</h3>\n<p><span class=\"lbl\">ポイント：</span>名詞の直前に置いて、その名詞の性質や状態を説明します。</p>\n<div class=\"ex\">He bought a <b>red</b> car. (彼は赤い車を買った。)</div>\n<div class=\"ex\">They live in a <b>quiet</b> neighborhood. (彼らは近隣が静かな所に住んでいる。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>指示形容詞</h3>\n<p><span class=\"lbl\">ポイント：</span>this, that, these, those が名詞の直前に置かれ、「この〜」「あの〜」という意味になります。</p>\n<div class=\"ex\"><b>This</b> laptop is broken. (このノートパソコンは壊れている。)</div>\n<div class=\"ex\">Can you see <b>those</b> birds? (あの鳥たちが見えますか？)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 1-3では一般動詞（自動詞・他動詞、do と have）と命令形を扱います。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>一般動詞：自動詞</h3>\n<p>目的語（動作の対象となる語）を必要としない動詞です。「主語＋動詞」だけで文が成り立つか、後ろに「前置詞＋名詞」などの修飾語句が続きます。</p>\n<p><span class=\"lbl\">ポイント：</span>動作が主語自身で完結する場合に使います。</p>\n<div class=\"ex\">The train <b>arrived</b> at the station on time. (列車は定刻に駅に到着した。)</div>\n<div class=\"ex\">She <b>swims</b> very fast. (彼女はとても速く泳ぐ。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>一般動詞：他動詞</h3>\n<p>動作の対象となる目的語（名詞・代名詞）を直後に必要とする動詞です。「主語 (S)＋動詞 (V)＋目的語 (O)」の形になります。</p>\n<p><span class=\"lbl\">ポイント：</span>「～を」「～に」にあたる言葉がないと意味が通じない動詞です。</p>\n<div class=\"ex\">He <b>wrote</b> a report regarding the incident. (彼はその出来事に関する報告書を書いた。)</div>\n<div class=\"ex\">We <b>enjoy</b> playing tennis on weekends. (私たちは週末にテニスを楽しむ。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>一般動詞：do と have</h3>\n<p><span class=\"lbl\">do：</span>「（動作・行為）を行う」という意味の動作動詞です。家事や仕事、活動などによく使われます。</p>\n<div class=\"ex\">Please <b>do</b> the dishes after dinner. (夕食後にお皿を洗ってください。)</div>\n<p><span class=\"lbl\">have：</span>「持っている（所有）」という<b>状態を表す場合</b>と、「飲む」「食べる」「（経験を）する」という<b>動作を表す場合</b>があります。</p>\n<div class=\"ex\">They <b>have</b> a beautiful cottage near the lake. (彼らは湖の近くに美しいコテージを持っている。)</div>\n<div class=\"ex\">I <b>have</b> a cup of coffee in the morning. (私は朝コーヒーを飲みます)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>命令形</h3>\n<p>相手に何かをするように指示、依頼、勧誘、禁止するときに使います。主語（You）を省略し、動詞の原形から文を始めます。</p>\n<p><span class=\"lbl\">肯定の命令文：</span>動詞の原形で始めます。「～しなさい」「～してください」。</p>\n<div class=\"ex\"><b>Turn</b> right at the next traffic light. (次の信号を右に曲がってください。)</div>\n<p><span class=\"lbl\">否定の命令文：</span>Don't + 動詞の原形で始めます。「～してはいけない」「～しないで」。</p>\n<div class=\"ex\"><b>Don't hesitate</b> to ask questions. (質問するのをためらわないで。)</div>\n<p><span class=\"lbl\">be動詞の命令文：</span>be + 形容詞/名詞の形になります。否定形はDon't be ~.です。</p>\n<div class=\"ex\"><b>Be</b> careful with the wet floor. (濡れた床に気をつけて。)</div>\n<div class=\"ex\"><b>Don't be</b> silly. (ふざけないで。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 1-4のテーマは「名詞の数え方」です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>数えられる名詞と数えられない名詞</h3>\n<p><span class=\"lbl\">数えられる名詞：</span>形が決まっていて、1つ、2つと数えられるもの。単数形には a/an をつけ、複数形には -s をつけます (例: a dog, two cats, many ideas, <b>memories</b>)。</p>\n<div class=\"ex\">She has <b>many ideas</b> for the new project. (彼女はその新しいプロジェクトについて多くのアイデアを持っています。)</div>\n<p><span class=\"lbl\">数えられない名詞：</span>液体、気体、素材、抽象的な概念など。常に単数扱いで、a/an はつきません (例: water, music, <b>information</b>, <b>advice</b>, furniture, money, news で、× an advice, × two informations, × three furnitures)。</p>\n<div class=\"ex\"><b>Music</b> helps people relax after a long day. (音楽は長い一日の後に人々をリラックスさせます。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>単位をつけて数える表現</h3>\n<p>数えられない名詞を数える場合、容器や単位を使います。</p>\n<p><span class=\"lbl\">a cup of ~ / a glass of ~：</span>飲み物など (パッセージの例: <b>a glass of water</b>, <b>a cup of tea</b>)</p>\n<p><span class=\"lbl\">a piece of ~：</span>形のないもの、一片 (パッセージの例: <b>a piece of advice</b> (一つの助言), <b>pieces of information</b> (情報の断片))</p>\n<div class=\"ex\">She ordered <b>two cups of</b> tea at the café. (彼女はカフェで紅茶を２杯注文しました。)</div>\n<div class=\"ex\">Let me give you <b>a piece of news</b>. (一つ知らせがあります。)</div>\n<p><span class=\"lbl\">a slice of ~：</span>薄く切ったもの (bread, cheese, pizza)</p>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>常に複数形の表現</h3>\n<p>2つの部分から構成される道具や衣類は、1つでも常に複数形 (-s) で扱い、数えるときは a pair of ~ を使います。</p>\n<p><span class=\"lbl\">例：</span>glasses (眼鏡), scissors (ハサミ), pants / trousers (ズボン), headphones, shoes (左右で一対) (パッセージの例: <b>a pair of headphones</b>, <b>an old pair of shoes</b>)</p>\n<div class=\"ex\">I need to buy <b>a new pair of sunglasses</b>. (私は新しいサングラスを買う必要があります。)</div>\n<div class=\"ex\">My glasses <b>are</b> broken. (私のメガネは壊れている。- 動詞も複数形の主語に対応)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 1-5で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>疑問代名詞</h3>\n<p><span class=\"lbl\">ポイント：</span>Who（誰）、What（何）、Which（どちら）は、主語としても目的語としても使われます。文の最初に来て、具体的な情報を求めます。</p>\n<div class=\"ex\"><b>Who</b> broke the window? (誰が窓を割ったのですか？ - 主語)</div>\n<div class=\"ex\"><b>What</b> are you looking for? (あなたは何を探しているのですか？ - 目的語)</div>\n<div class=\"ex\"><b>Which</b> is yours, the blue one or the red one? (どちらがあなたのですか、青いの、それとも赤いの？ - 主語)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>人称代名詞の目的格</h3>\n<p><span class=\"lbl\">ポイント：</span>動詞や前置詞の後ろでは、人称代名詞は目的格（me, us, you, him, her, it, them）になります。</p>\n<div class=\"ex\">Please tell <b>him</b> the truth. (彼に真実を伝えてください。 - 動詞の目的語)</div>\n<div class=\"ex\">I bought this gift for <b>her</b>. (私は彼女のためにこの贈り物を買った。 - 前置詞の目的語)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>固有名詞</h3>\n<p><span class=\"lbl\">ポイント：</span>特定の人、場所、組織などの名前です。常に大文字で始めます。「～家の人々」など、Theをつけて複数扱いにすることもあります。</p>\n<div class=\"ex\"><b>Paris</b> is famous for art. (パリは芸術で有名だ。)</div>\n<div class=\"ex\"><b>The Johnsons</b> are coming to dinner. (ジョンソン一家が夕食に来ます。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>抽象名詞</h3>\n<p><span class=\"lbl\">ポイント：</span>目に見えない概念（愛、平和、情報など）を表す名詞です。基本的に不可算名詞扱いで、a/anはつかず、複数形にもなりません。抽象名詞には量を表す語句がよく付きます（some, any, much, a lot ofなど）。</p>\n<div class=\"ex\"><b>Health</b> is better than wealth. (健康は富に勝る。)</div>\n<div class=\"ex\">He gave me <b>some good advice</b>. (彼は私に良いアドバイスをくれた。) ※ adviceは数えられない。</div>\n<div class=\"ex\">I have <b>a lot of homework</b> today. (今日はたくさんの宿題があります。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>場所の名詞における冠詞「the」の使い分け</h3>\n<p><span class=\"lbl\">ポイント１：</span>go to bed / go to work / go to school のように、その場所本来の目的（寝る、働く、学ぶ）で移動する場合は無冠詞です。</p>\n<div class=\"ex\">I go to <b>bed</b> at 11 p.m. (私は午後11時に寝ます。)</div>\n<div class=\"ex\">I went to <b>school</b> in the afternoon. (私は午後に学校へ行った。)</div>\n<p><span class=\"lbl\">ポイント２：</span>特定の建物や場所を指す場合は the をつけます（例: go to the office）が、生活に身近な場所（the store, the bank, the library, the hospital）には不特定でもtheをつけます。</p>\n<div class=\"ex\">My mother goes to <b>the store</b> every day. (母は毎日買い物に行っています。) ※ the storeは不特定のお店です。</div>\n<div class=\"ex\">She goes to <b>the library</b> on weekends. (彼女は週末には図書館に行っています。) ※ the libraryは特定かもしれないし、図書館一般のことかもしれません。</div>\n<p><span class=\"lbl\">ポイント３：</span>施設や建造物を表す固有名詞にはtheが付くことがあります。</p>\n<div class=\"ex\">We visited <b>the Eiffel Tower</b>. (私たちはエッフェル塔に行きました。)</div>\n<div class=\"ex\">You can take a ferry to see <b>the Statue of Liberty</b>. (自由の女神を見るためにフェリーに乗れます。)</div>\n</div>\n<div class=\"gi\" id=\"gi6\">\n      <h3><span class=\"n\">6</span>前置詞 + 名詞</h3>\n<p><span class=\"lbl\">ポイント１：</span>前置詞と名詞のセットで、形容詞（名詞を修飾）や副詞（動詞などを修飾）の働きをします。</p>\n<div class=\"ex\">The book <b>on the desk</b> is mine. (机の上の本は私のです。 - 形容詞的用法)</div>\n<div class=\"ex\">She runs <b>in the park</b>. (彼女は公園で走る。 - 副詞的用法)</div>\n<p><span class=\"lbl\">ポイント２：</span>前置詞は、特に日本語の語感とズレるケースが重要です。</p>\n<div class=\"ex\">She is active <b>in a club</b>. (彼女はクラブで活動しています。)</div>\n<div class=\"ex\">He plays <b>on the team</b>. (彼はそのチームでプレーしています。)</div>\n<div class=\"ex\">Their house is <b>on the shore of Lake Biwa</b>. (彼らの家は琵琶湖のほとりにあります。)</div>\n<div class=\"ex\">They grew up <b>on a farm</b>. (彼らは農場で育ちました。)</div>\n<div class=\"ex\">He still lives <b>on the island</b>. (彼は今もその島に住んでいます。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 1-6 で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>疑問形容詞</h3>\n<p><span class=\"lbl\">What + 名詞：</span>「何の～」「どんな～」。選択肢が限定されていない場合に使います。</p>\n<div class=\"ex\"><b>What</b> color do you like best? (どんな色が一番好きですか？)</div>\n<p><span class=\"lbl\">Which + 名詞：</span>「どちらの～」「どの～」。限られた選択肢の中から選ぶ場合に使います。</p>\n<div class=\"ex\"><b>Which</b> road is faster, this one or that one? (どちらの道が速いですか、これ、それともあれ？)</div>\n<p><span class=\"lbl\">Whose + 名詞：</span>「誰の～」。所有者を尋ねる場合に使います。</p>\n<div class=\"ex\"><b>Whose</b> smartphone is ringing? (誰のスマホが鳴っているのですか？)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>基本の前置詞</h3>\n<p><span class=\"lbl\">of：</span>「～の」「～について（分離・起源）」。</p>\n<div class=\"ex\">I want a cup <b>of</b> coffee. (コーヒーを一杯欲しい。)</div>\n<div class=\"ex\">He died <b>of</b> cancer. (彼は癌で亡くなった。)※「その事故で亡くなる」はdie from the accidentのように言います。一般に、病気など直接の原因にはof、事故やけがなど外的な原因にはfromが使われる傾向があります（実際には両方使われることもあります）。</div>\n<p><span class=\"lbl\">for：</span>「～のために」「～の間（期間）」「～に向けて（目的）」。</p>\n<div class=\"ex\">This gift is <b>for</b> you. (この贈り物はあなたへのものです。)</div>\n<div class=\"ex\">I waited <b>for</b> two hours. (私は2時間待ちました。)</div>\n<p><span class=\"lbl\">on：</span>「～に接触して（天井や壁も「接触」でon）」「～に（特定の日付・曜日）」。</p>\n<div class=\"ex\">The picture is <b>on</b> the wall. (絵は壁にかかっています。)</div>\n<div class=\"ex\">Let's meet <b>on</b> Sunday. (日曜日に会いましょう。)</div>\n<p><span class=\"lbl\">in：</span>「～の中に（空間）」「～に（月・年・季節などの期間）」。</p>\n<div class=\"ex\">She lives <b>in</b> London. (彼女はロンドンに住んでいます。)</div>\n<div class=\"ex\">My birthday is <b>in</b> August. (私の誕生日は8月です。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>基本の接続詞</h3>\n<p><span class=\"lbl\">and：</span>「～と...」「そして」。対等なものを結びます。</p>\n<div class=\"ex\">I like apples <b>and</b> oranges. (私はリンゴとオレンジが好きです。)</div>\n<p><span class=\"lbl\">or：</span>「～か...」「または」。選択肢を示したり、否定文で「～も...も（ない）」を表したりします。</p>\n<div class=\"ex\">Do you want tea <b>or</b> coffee? (紅茶かコーヒー、どちらがいいですか？)</div>\n<div class=\"ex\">Hurry up, <b>or</b> you will be late. (急ぎなさい、さもないと遅れますよ。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 1-10 の文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>be動詞の過去形</h3>\n<p><span class=\"lbl\">ポイント：</span>am/is の過去形は was、are の過去形は were です。過去の状態や身分を表します。</p>\n<div class=\"ex\">I <b>was</b> tired yesterday. (私は昨日疲れていた。)</div>\n<div class=\"ex\">They <b>were</b> at the library last night. (彼らは昨夜図書館にいた。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>itの用法</h3>\n<p><span class=\"lbl\">天候・時間・距離：</span>具体的な訳語を持たない it。</p>\n<p><span class=\"lbl\">状況：</span>その場の状況を漠然と指す it。</p>\n<p><span class=\"lbl\">仮主語/形式主語：</span>It is ... to ~ や It is ... that ~ の形で、真の主語（to不定詞やthat節）を指す it。</p>\n<div class=\"ex\"><b>It</b> is raining heavily. (激しく雨が降っている。 - 天候)</div>\n<div class=\"ex\"><b>It</b> is five kilometers to the station. (駅まで5キロです。 - 距離)</div>\n<div class=\"ex\">I don't like <b>it</b> when he is drunk. (彼が酔っ払っている時は嫌いだ。 - 状況)</div>\n<div class=\"ex\"><b>It</b> was fun to play soccer. (サッカーをするのは楽しかった。 - 仮主語)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>名詞の同格</h3>\n<p><span class=\"lbl\">ポイント：</span>名詞の後にコンマを置き、別の名詞で説明を補足する用法です。「A, B」で「AであるB」や「BであるA」という意味になります。</p>\n<div class=\"ex\"><b>Mr. Tanaka</b>, <b>my math teacher</b>, is very strict. (私の数学の先生である田中先生は、とても厳しい。)</div>\n<div class=\"ex\"><b>Tokyo</b>, <b>the capital of Japan</b>, is a huge city. (日本の首都である東京は、巨大な都市だ。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>副詞の注意点</h3>\n<p><span class=\"lbl\">right：</span>「右」「正しい」だけでなく、場所や時間を強調して「まさに」「ちょうど」という意味の副詞として使われます。</p>\n<div class=\"ex\">The keys are <b>right</b> here. (鍵はまさにここにあります。)</div>\n<p><span class=\"lbl\">pretty：</span>「かわいい」だけでなく、副詞として「かなり」「相当」という意味（veryに近いが口語的）で使われます。</p>\n<div class=\"ex\">The test was <b>pretty</b> difficult. (そのテストはかなり難しかった。)</div>\n<p><span class=\"lbl\">too：</span>「〜もまた」の他に、形容詞・副詞の前で「〜すぎる（過度）」という意味を表します。</p>\n<div class=\"ex\">This soup is <b>too</b> hot to eat. (このスープは熱すぎて食べられない。)</div>\n</div>",

 "grammar": "<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>一般動詞の過去形</h3>\n<p><span class=\"lbl\">ポイント：</span>過去に起きて終了した動作や状態を表します。</p>\n<p><span class=\"lbl\">規則動詞：</span>動詞の原形に -ed をつけます（例: play → played）。</p>\n<p><span class=\"lbl\">不規則動詞：</span>形が不規則に変化します（例: go → went, say → said）。</p>\n<p><span class=\"lbl\">否定文：</span>didn't + 動詞の原形を使います。</p>\n<div class=\"ex\">I <b>enjoyed</b> the party last night. （規則：昨夜のパーティーを楽しみました。）</div>\n<div class=\"ex\">She <b>woke</b> up early this morning. （不規則：彼女は今朝早く起きました。）</div>\n<div class=\"ex\">We <b>didn't see</b> him at the station. （否定：私たちは駅で彼を見かけませんでした。）</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>助動詞 can / could</h3>\n<p><span class=\"lbl\">ポイント：</span>canは「能力（できる）」や「（一般的）可能性」を表します。</p>\n<div class=\"ex\">She <b>can</b> play tennis. (彼女はテニスが出来ます（能力）)</div>\n<div class=\"ex\">This illness <b>can</b> be serious. (この病気は（一般論として言えば）シリアスになる可能性があります)</div>\n<p>※canの代わりにmayだと実際の患者さんの病気の話になります (このあなたの病気はシリアスなのかも)。</p>\n<p><span class=\"lbl\">ポイント：</span>could は、過去の「能力（～できた）」や「可能性（～ありえる）」を表します。</p>\n<p>「過去に（困難な状況で）1回だけできた」という達成を表す場合は、肯定文では was/were able to を使うのが一般的です。could は「（その気になれば）できた」という能力を表す傾向があります。couldは未来の可能性「ひょっとすると〜かもしれない」にも使えます。</p>\n<div class=\"ex\">My grandmother <b>could</b> play the piano beautifully.（過去の能力：祖母はピアノを美しく弾くことができた。）</div>\n<div class=\"ex\">It <b>could</b> rain later.（未来の可能性：ひょっとすると後で雨が降るかもしれない。）</div>\n<div class=\"ex\">I <b>couldn't</b> hear what he said.（過去の不可能性：彼が言ったことが聞こえなかった。）</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>名詞の所有格と二重所有格</h3>\n<p><span class=\"lbl\">ポイント：</span>所有格 ('s): Sarah's bag のように名詞に 's をつけて所有を表します。二重所有格: a friend of mine のように、「冠詞（a/an/this/that）+ 名詞 + of + 所有代名詞（mine, yours, his, hers, ours, theirs）」の順序で作ります。「私の友人の一人」と言うとき a my friend とは言えません。</p>\n<div class=\"ex\">Is that <b>Ken's</b> bicycle?（あれはケンの自転車ですか？）</div>\n<div class=\"ex\">I borrowed a book from <b>a friend of yours</b>.（あなたの友人から本を借りました。）</div>\n<div class=\"ex\">That joke of <b>his</b> always makes me laugh.（彼のその冗談はいつも私を笑わせる。）</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 2-1 で扱われている重要項目を解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>助動詞 may / might</h3>\n<p><span class=\"lbl\">ポイント：</span>「許可（～してもよい）」と「推量（～かもしれない）」を表します。might は may の過去形ですが、推量の意味では may よりも確信度が低い（ひょっとしたら～かも）場合に使われます。確信度は will ＞ should ＞ may ＞ might / could の順で低くなります。</p>\n<div class=\"ex\"><b>May</b> I ask a question? (質問してもよろしいですか？ - 許可)</div>\n<div class=\"ex\">It <b>may</b> be cold tomorrow. (明日は寒くなるかもしれない。 - 可能性)</div>\n<div class=\"ex\">It <b>might</b> rain this afternoon, so take an umbrella. (ひょっとして午後は雨が降るかもしれないから、傘を持って行きなさい。 - 可能性)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>助動詞 will / would</h3>\n<p><span class=\"lbl\">ポイント：</span>will は「意志（～するつもりだ）」や「単純未来（～だろう）」を表します。would は will の過去形ですが、丁寧な依頼や、「もし～なら…だろう」という仮定のニュアンスでよく使われます。</p>\n<div class=\"ex\">I <b>will</b> call you back in five minutes. (5分後に折り返し電話します。 - 意志 ※その場で決めた意志)</div>\n<div class=\"ex\">It <b>will</b> be fine tomorrow. (明日は晴れるだろう。 - 単純未来)</div>\n<div class=\"ex\"><b>Would</b> you mind opening the door? (ドアを開けていただけますでしょうか？ - 丁寧な依頼)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>未来表現</h3>\n<p><span class=\"lbl\">ポイント：</span>未来を表すには will 以外にもいくつかの方法があります。</p>\n<p><span class=\"lbl\">be going to：</span>「あらかじめ決めている予定」や「（雲行きなどを見て）～しそうだという兆候」。</p>\n<div class=\"ex\">I <b>am going to</b> visit my parents this weekend. (週末に両親を訪ねるつもりにしています。※前から決めていた)</div>\n<p><span class=\"lbl\">現在進行形 (be -ing)：</span>「個人的な近未来の確定した予定（手配済みのことなど）」。※ be going to にも「予定」のニュアンスがあるので意味が重なります。</p>\n<div class=\"ex\">We <b>are meeting</b> him at 10 a.m. tomorrow. (明日午前10時に彼と会う予定です。)</div>\n<p><span class=\"lbl\">現在形：</span>「（第三者が決めた）確定的なスケジュール（電車の時刻表、クラススケジュール、契約など）」。</p>\n<div class=\"ex\">My plane <b>leaves</b> at 7 this evening. (私の飛行機は今夜７時発です。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>再帰代名詞</h3>\n<p><span class=\"lbl\">ポイント：</span>myself, yourself, himself, herself, itself, ourselves, yourselves, themselves など。主語と目的語が同一人物の場合や、強調する場合に使われます。</p>\n<div class=\"ex\">She bought <b>herself</b> a new dress. (彼女は自分自身に新しいドレスを買った。)</div>\n<div class=\"ex\">I spoke to the manager <b>himself</b>. (私はマネージャー本人と話しました。 - 強調)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 2-2で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>その他の疑問文</h3>\n<p><span class=\"lbl\">否定疑問文：</span>「～ではないのですか？」と意外な気持ちや同意を求める際に使います。</p>\n<div class=\"ex\"><b>Can't you</b> hear that noise? (あの音が聞こえないのですか？)</div>\n<p><span class=\"lbl\">付加疑問文：</span>文末に短縮形の疑問形を付け、「～ですよね？」と念を押したり同意を求めたりします。肯定文には否定のタグ、否定文には肯定のタグを付けます。</p>\n<div class=\"ex\">You prefer coffee to tea, <b>don't you?</b> (あなたは紅茶よりコーヒーが好きですよね？)</div>\n<div class=\"ex\">She isn't coming tomorrow, <b>is she?</b> (彼女は明日来ないんですよね？)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>助動詞 (shall / should / must / have to)</h3>\n<p><span class=\"lbl\">shall：</span>提案や申し出に使います。Shall I...?（～しましょうか？）、Shall we...?（～しませんか？）、Let's ..., shall we?（～しましょうよ）の形が一般的です。</p>\n<div class=\"ex\"><b>Shall</b> I carry your bag for you? (かばんをお持ちしましょうか？)</div>\n<p><span class=\"lbl\">should：</span>「～すべきだ」「～したほうがよい」という義務やアドバイス、または「～のはずだ」という推量を表します。また、Should は Shall の提案や申し出と同じニュアンスでも使えます。その場合 Shall の方が少しフォーマルです。</p>\n<div class=\"ex\">You <b>should</b> apologize to him immediately. (すぐに彼に謝るべきだよ。)</div>\n<div class=\"ex\"><b>Should</b>/<b>Shall</b> I open the window? (その窓開けましょうか？)</div>\n<p><span class=\"lbl\">must：</span>「～しなければならない」という強い義務（話し手の主観的な命令に近い）や、「～に違いない」という強い確信を表します。否定形 must not は「～してはいけない（禁止）」です。</p>\n<div class=\"ex\">You <b>must</b> keep this secret. (このことは秘密にしなければなりません。)</div>\n<div class=\"ex\">You <b>mustn't</b> tell anyone about this. (これを誰にも言ってはいけません。)</div>\n<p><span class=\"lbl\">have to：</span>「～しなければならない」という義務を表しますが、must より客観的な状況による必要性を示します。否定形 don't have to は「～する必要はない（不必要）」という意味になり、禁止ではないので注意が必要です。</p>\n<div class=\"ex\">I <b>have to</b> submit the report by 5 p.m. today. (今日の午後5時までにレポートを提出しなければなりません。)</div>\n<div class=\"ex\">We <b>don't have to</b> wear a uniform at this company. (この会社では制服を着る必要はありません。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>第4文型 (S+V+O+O)</h3>\n<p><span class=\"lbl\">構造：</span>主語(S) + 動詞(V) + 間接目的語(IO: 誰に) + 直接目的語(DO: 何を)。「誰かに何かを与える・してくれる」という意味の動詞が使われます。</p>\n<p><span class=\"lbl\">give型：</span>give, show, tell, send, teach など。第3文型に書き換えるときは to を使います。</p>\n<div class=\"ex\">She <b>showed</b> me her photo album. (彼女は私にアルバムを見せてくれた。) (第３文型: She showed her photo album <b>to me</b>.)</div>\n<p><span class=\"lbl\">buy型：</span>buy, make, cook, get, find など。第3文型に書き換えるときは for を使います。</p>\n<div class=\"ex\">My father <b>made</b> us a delicious dinner. (父は私たちにおいしい夕食を作ってくれた。) (第３文型: My father made a delicious dinner <b>for us</b>.)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 2-3で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>準動詞 ― 不定詞</h3>\n<p><span class=\"lbl\">ポイント：</span>「to + 動詞の原形」で、名詞・形容詞・副詞の働きをします。</p>\n<p><span class=\"lbl\">名詞的用法：</span>主語、目的語、補語になります。「～すること」</p>\n<div class=\"ex\"><b>To read</b> books is my hobby. (本を読むことは私の趣味です。) [主語]</div>\n<div class=\"ex\">I want <b>to read</b> more English books. (英語の本をもっと読むことを望んでいます。) [目的語]</div>\n<div class=\"ex\">My dream is <b>to become</b> a translator. (私の夢は翻訳者になることです。) [補語]</div>\n<p><span class=\"lbl\">形容詞的用法：</span>名詞を後ろから修飾します。「～するための」「～すべき」</p>\n<div class=\"ex\">I have a lot of homework <b>to do</b>. (私にはやるべき宿題がたくさんあります。)</div>\n<p><span class=\"lbl\">副詞的用法：</span>動詞や形容詞を修飾します。「～するために」「～して」</p>\n<div class=\"ex\">He studied hard <b>to pass</b> the exam. (彼は試験に合格するために一生懸命勉強しました。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>助動詞 can と be able to</h3>\n<p><span class=\"lbl\">ポイント：</span>どちらも「能力」や「可能」を表しますが、can は他の助動詞（will, mayなど）と併用できないため、未来や完了形などで「～できるだろう」「～できている」と言いたい場合は be able to を使います。</p>\n<div class=\"ex\">I will <b>be able to</b> speak Spanish soon. (私はもうすぐスペイン語が話せるようになるでしょう。) [未来]</div>\n<div class=\"ex\">I haven't <b>been able to</b> sleep lately. (最近眠れていません。) [現在完了]</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>助動詞(句)同士の相対的な関係 (推量・可能性の度合い)</h3>\n<p><span class=\"lbl\">ポイント：</span>確信度の強さは一般的に must (～に違いない) ＞ will (～だろう) ＞ should (～のはずだ) ＞ may (～かもしれない) ＞ might / could (ひょっとすると～かもしれない) の順になります。</p>\n<div class=\"ex\">The light is on. She <b>must</b> be home. (電気がついている。彼女は家にいるに違いない。)</div>\n<div class=\"ex\">It <b>might</b> snow tomorrow. (明日はひょっとして雪が降るかもしれない。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>第2文型 (SVC) で使われるbe動詞以外の動詞</h3>\n<p><span class=\"lbl\">ポイント：</span>look (～に見える), sound (～に聞こえる), smell (～の匂いがする), taste (～の味がする), feel (～の感じがする), seem / appear (～のように思われる), become / get (～になる), remain / stay (～のままである) など。補語(C)には形容詞や名詞が来ます。</p>\n<div class=\"ex\">This soup <b>tastes</b> salty. (このスープは塩辛い味がします。)</div>\n<div class=\"ex\">He <b>seems</b> busy today. (彼は今日忙しそうです。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>2種類の There ～. のセンテンス</h3>\n<p><span class=\"lbl\">ポイント：</span>通常の There is/are... 以外に、助動詞や seem to be などを伴う形があります。</p>\n<div class=\"ex\"><b>There seems to be</b> a mistake in the report. (レポートに間違いがあるようです。)</div>\n<div class=\"ex\"><b>There used to be</b> a park here. (以前ここには公園がありました。)</div>\n</div>\n<div class=\"gi\" id=\"gi6\">\n      <h3><span class=\"n\">6</span>文を修飾する副詞</h3>\n<p><span class=\"lbl\">ポイント：</span>文頭に置いて、文全体の内容に対する話し手の評価や態度を表します。Fortunately (幸いなことに), Surprisingly (驚いたことに), Actually (実は), Hopefully (願わくば) など。</p>\n<div class=\"ex\"><b>Sadly</b>, he failed the test. (悲しいことに、彼は試験に落ちました。)</div>\n</div>\n<div class=\"gi\" id=\"gi7\">\n      <h3><span class=\"n\">7</span>第5文型 [S+V+O+C]</h3>\n<p><span class=\"lbl\">ポイント：</span>目的語(O)の状態や性質を補語(C)で説明します。「O=C」の関係が成り立ちます。動詞には make, keep, find, call, name, leave などが使われます。</p>\n<div class=\"ex\">The news made her happy. (その知らせは彼女を幸せにしました。) [She = happy]</div>\n<div class=\"ex\">I found the movie boring. (私はその映画がつまらないと分かりました。) [The movie = boring]</div>\n<div class=\"ex\">Tom made Sally his wife. (トムはサリーを自分の奥さんにしました。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 2-4 で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>動名詞の働き</h3>\n<p><span class=\"lbl\">ポイント：</span>動詞に -ing を付けた形で、名詞と同じ働き（主語、目的語、補語）をします。「～すること」と訳します。</p>\n<div class=\"ex\"><b>Swimming</b> is good for your health. (泳ぐことは健康に良いです。) [主語]</div>\n<div class=\"ex\">My father enjoys <b>fishing</b> on weekends. (私の父は週末に釣りをして楽しみます。) [目的語]</div>\n<div class=\"ex\">My favorite hobby is <b>collecting</b> stamps. (私の一番好きな趣味は切手を集めることです。) [補語]</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>動名詞の意味上の主語</h3>\n<p><span class=\"lbl\">ポイント：</span>動名詞の意味上の主語を示す場合、動名詞の直前に所有格（または目的格）を置きます。</p>\n<div class=\"ex\">Do you mind <b>my</b> opening the window? (私が窓を開けても構いませんか？)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>動名詞か不定詞かで意味が変わる動詞</h3>\n<p><span class=\"lbl\">remember / forget：</span>remember doing：（過去に）～したことを覚えている。<br>remember to do：（これから）忘れずに～する。</p>\n<div class=\"ex\">I <b>remember locking</b> the door. (私はドアに鍵をかけたことを覚えています。)</div>\n<div class=\"ex\">Please <b>remember to lock</b> the door. (忘れずにドアに鍵をかけてね。)</div>\n<p><span class=\"lbl\">try：</span>try doing：（試しに）～してみる（実験的に行う）。<br>try to do：～しようと努力する（挑戦するが、成功するかは不明）。</p>\n<div class=\"ex\">I <b>tried going</b> to Stanford by train and bus, but it took too long. (電車とバスでスタンフォード大学に行ってみたけれど、時間がかかりすぎました。)</div>\n<div class=\"ex\">I <b>tried to go</b> to Stanford, but I couldn't get a visa in time. (スタンフォード大学に行こうとしたけれど、ビザが間に合いませんでした。)</div>\n<p><span class=\"lbl\">stop：</span>stop doing：～するのをやめる。<br>stop to do：～するために立ち止まる（手を休める）。</p>\n<div class=\"ex\">I <b>stopped smoking</b>. (私はタバコをやめました。)</div>\n<div class=\"ex\">I <b>stopped to smoke</b>. (私はタバコを吸うために立ち止まりました。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>等位接続詞と省略</h3>\n<p><span class=\"lbl\">ポイント：</span>and, but, or などの等位接続詞を使って文をつなぐ際、共通する語句（動詞など）は省略されることがあります。</p>\n<div  "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 2-5で扱われている主な文法ポイントです。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>受動態の基本</h3>\n<p><span class=\"lbl\">ポイント：</span>「～される」という受け身の意味を表します。行為者（by ～）は省略されることが多いです。</p>\n<div class=\"ex\">The project <b>was finished</b> yesterday. (そのプロジェクトは昨日完了しました。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>S+V+O+Oの受動態</h3>\n<p><span class=\"lbl\">ポイント：</span>「人に物を与える」などの動詞の場合、「人が～を与えられる」または「物が人に与えられる」という2通りの受動態が作れます。</p>\n<div class=\"ex\">We were shown the map. (私たちは地図を見せられました。)</div>\n<div class=\"ex\">The map was shown to us. (地図が私たちに示されました。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>S+V+O+Cの受動態</h3>\n<p><span class=\"lbl\">ポイント：</span>「OをCの状態にする/呼ぶ」などの文を受動態にすると、「SはCの状態にされる/呼ばれる」となります。</p>\n<div class=\"ex\">The door was left open. (ドアは開けっ放しにされました。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>自動詞の受動的用法</h3>\n<p><span class=\"lbl\">ポイント：</span>受動態の形をとらなくても、主語の性質として「～される（ような性質だ）」という意味を表す動詞があります（sell, cut, wash, cookなど）。副詞を伴うことが多いです。</p>\n<div class=\"ex\">This pen <b>writes</b> smoothly. (このペンは滑らかに書けます。)</div>\n<div class=\"ex\">These apples <b>peel</b> easily. (このリンゴは皮が簡単にむけます。)</div>\n<div class=\"ex\">This bread <b>slices</b> thinly. (このパンは薄く切れます。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>getを使った受動表現</h3>\n<p><span class=\"lbl\">ポイント：</span>be + 過去分詞 の代わりに get + 過去分詞 を使うと、動作や変化のニュアンスが強まります。「（被害を）受ける」や「～になる」という場合によく使われます。</p>\n<div class=\"ex\">He <b>got</b> hurt in the game. (彼は試合で怪我をしました。)</div>\n</div>\n<div class=\"gi\" id=\"gi6\">\n      <h3><span class=\"n\">6</span>分詞の形容詞的用法 (-ing vs -ed)</h3>\n<p><span class=\"lbl\">現在分詞 (-ing)：</span>「（人を）～させるような」という意味で、感情の原因となる物事や、能動的な動作を表します。</p>\n<p><span class=\"lbl\">過去分詞 (-ed)：</span>「～させられた（感情を持った）」や「～された（受け身・完了）」という意味を表します。</p>\n<div class=\"ex\">The movie was <b>boring</b>. (その映画は退屈でした。)</div>\n<div class=\"ex\">I was <b>bored</b> with the lecture. (私はその講義に退屈していました。)</div>\n<div class=\"ex\">Look at the <b>broken</b> window. (割れた窓を見てください。)</div>\n</div>\n<div class=\"gi\" id=\"gi7\">\n      <h3><span class=\"n\">7</span>知覚動詞 + O + 分詞</h3>\n<p><span class=\"lbl\">ポイント：</span>see, hear, feel などの動詞の後ろに、目的語と分詞を置くことで、「Oが～しているのを見る/聞く」（現在分詞）や「Oが～されるのを見る/聞く」（過去分詞）を表します。</p>\n<div class=\"ex\">I <b>heard</b> the dog barking. (私は犬が吠えているのを聞きました。)</div>\n<div class=\"ex\">I <b>saw</b> the car taken away. (私は車が持ち去られるのを見ました。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 2-6で扱われている主な文法ポイントです。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>名詞節を導く接続詞</h3>\n<p><span class=\"lbl\">that節：</span>「～ということ」という意味で、動詞の目的語や主語、補語になります。</p>\n<div class=\"ex\">I believe <b>that</b> education changes lives. (私は教育が人生を変えると信じています。)</div>\n<p><span class=\"lbl\">疑問詞 (who, what, when, where, why, how) で始まる節：</span>「誰が～か」「何を～か」などの意味で名詞の働きをします。</p>\n<div class=\"ex\">Do you know <b>where he lives?</b> (彼がどこに住んでいるか知っていますか？)</div>\n<div class=\"ex\"><b>What she said</b> surprised me. (彼女が言ったことは私を驚かせた。)</div>\n<p><span class=\"lbl\">if / whether節：</span>「～かどうか」という意味を表します。</p>\n<div class=\"ex\">I wonder <b>if it will rain tomorrow.</b> (明日雨が降るかなあ。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>形式主語としてのit (It is ... that/wh- ...)</h3>\n<p><span class=\"lbl\">ポイント：</span>主語となる名詞節が長い場合、文頭に It を置き、真の主語（that節や間接疑問文など）を後ろに回す構文です。「～なのは...だ」と訳します。</p>\n<div class=\"ex\"><b>It is</b> important <b>that</b> you finish the report by Friday. (金曜日までにレポートを終わらせることが重要です。)</div>\n<div class=\"ex\"><b>It is</b> unclear <b>why</b> the system failed. (なぜシステムが故障したのかは不明確です。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>比較</h3>\n<p><span class=\"lbl\">同等比較 (as ... as)：</span>「...と同じくらい～」</p>\n<div class=\"ex\">This computer is <b>as fast as</b> that one. (このコンピュータはあれと同じくらい速いです。)</div>\n<p><span class=\"lbl\">比較級 (more ... than / -er than)：</span>「...よりも～」</p>\n<div class=\"ex\">Health is <b>more</b> valuable <b>than</b> wealth. (健康は富よりも価値があります。)</div>\n<p><span class=\"lbl\">強調：</span>much, far, a lot などを比較級の前に置くと「はるかに～」と強調できます。</p>\n<div class=\"ex\">Today is <b>much colder than</b> yesterday. (今日は昨日よりはるかに寒いです。)</div>\n<p><span class=\"lbl\">最上級 (the most ... / the -est)：</span>「最も～」</p>\n<div class=\"ex\">This is <b>the most interesting</b> book I have ever read. (これは私が今までに読んだ中で最も面白い本です。)</div>\n<p><span class=\"lbl\">劣等比較 (less ... than)：</span>「...ほど～でない」（...より少なく～だ）</p>\n<div class=\"ex\">This method is <b>less</b> effective <b>than</b> the old one. (この方法は古い方法ほど効果的ではありません。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 2-7で扱われている主な文法ポイントです。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>時・条件を表す副詞節</h3>\n<p><span class=\"lbl\">ポイント：</span>when, before, after, if などで始まる「時」や「条件」を表す副詞節の中では、未来のことでも現在形を使います。</p>\n<div class=\"ex\">I will call you <b>when</b> I arrive at the station. (駅に着いたら電話します。)※ when I will arrive... とはしません。</div>\n<div class=\"ex\"><b>If</b> you finish early, please call me. (早く終わったら、電話してください。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>理由・原因を表す接続詞</h3>\n<p><span class=\"lbl\">ポイント：</span>because は「なぜなら～だから」という直接的な理由を表し、since や as も理由を表すのによく使われます。</p>\n<div class=\"ex\">She stayed home <b>because</b> she had a fever. (彼女は熱があったので家にいました。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>譲歩を表す接続詞</h3>\n<p><span class=\"lbl\">though / although：</span>「～だけれども」という事実に基づいた逆接を表します。</p>\n<p><span class=\"lbl\">even if：</span>「たとえ～だとしても」という仮定の話を強調します。</p>\n<p><span class=\"lbl\">even though：</span>「～であるのに（実際そうだが）」という事実を強調します。</p>\n<div class=\"ex\"><b>Although</b> it was raining, we played soccer. (雨が降っていたが、私たちはサッカーをした。)</div>\n<div class=\"ex\">I will go <b>even if</b> nobody supports me. (たとえ誰も支持してくれなくても私は行きます。)</div>\n<div class=\"ex\">I will go <b>even though</b> nobody supports me. (誰も支持してくれないけど私は行きます。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>目的を表す接続詞</h3>\n<p><span class=\"lbl\">so (that)：</span>「～するように」「～するために」という目的を表します。しばしば can や will などの助動詞と共に使われます。</p>\n<div class=\"ex\">Please speak louder <b>so that</b> everyone can hear you. (みんなに聞こえるように、もっと大きな声で話してください。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>前置詞が不要な時を表す語句</h3>\n<p><span class=\"lbl\">ポイント：</span>this, next, last, every, all などがつく時を表す語句の前には、at, on, in などの前置詞を付けません。</p>\n<div class=\"ex\">I saw him <b>last Sunday</b>. (私は先週の日曜日に彼に会いました。) ※ on last Sunday とはしません。</div>\n<div class=\"ex\">We practice <b>every morning</b>. (私たちは毎朝練習します。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 3-1で扱われている主な文法ポイントです。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>現在完了形 (have / has + 過去分詞)</h3>\n<p><span class=\"lbl\">ポイント：</span>過去に起こったことが現在に何らかの影響を与えていることを表します。</p>\n<p><span class=\"lbl\">完了・結果：</span>「（ちょうど）～したところだ」「～してしまった（その結果今は…）」</p>\n<div class=\"ex\">I <b>have just finished</b> my lunch. (私はちょうど昼食を終えたところです。)</div>\n<p><span class=\"lbl\">経験：</span>「（今までに）～したことがある」</p>\n<div class=\"ex\">She <b>has visited</b> Paris three times. (彼女はパリを3回訪れたことがあります。)</div>\n<p><span class=\"lbl\">継続：</span>「（ずっと）～している」</p>\n<div class=\"ex\">We <b>have known</b> each other since childhood. (私たちは子供の頃から互いを知っています。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>関係代名詞</h3>\n<p><span class=\"lbl\">ポイント：</span>直前の名詞（先行詞）を修飾する節を作ります。</p>\n<p><span class=\"lbl\">主格：</span>関係詞節の中で主語の働きをします。</p>\n<p><span class=\"lbl\">who：</span>先行詞が「人」の場合。</p>\n<div class=\"ex\">The man <b>who</b> lives next door is a doctor. (隣に住んでいる男性は医者です。)</div>\n<p><span class=\"lbl\">which：</span>先行詞が「物・動物」の場合。</p>\n<div class=\"ex\">This is the book <b>which</b> became a bestseller. (これがベストセラーになった本です。)</div>\n<p><span class=\"lbl\">that：</span>先行詞が「人・物」どちらでも使えます。thatはwho, whichより口語寄りです。</p>\n<div class=\"ex\">I like movies <b>that</b> make me laugh. (私は笑わせてくれる映画が好きです。)</div>\n<p><span class=\"lbl\">目的格：</span>関係詞節の中で目的語の働きをします。省略されることがよくあります。</p>\n<p><span class=\"lbl\">whom / who / that：</span>先行詞が「人」の場合。</p>\n<div class=\"ex\">The woman (<b>whom</b>) I met yesterday was nice. (昨日会った女性は素敵でした。)</div>\n<p><span class=\"lbl\">which / that：</span>先行詞が「物」の場合。</p>\n<div class=\"ex\">The cake (<b>which</b>) she made was delicious. (彼女が作ったケーキは美味しかった。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 3-3で扱われている主な文法ポイントです。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>総称人称代名詞 (we, they, one)</h3>\n<p><span class=\"lbl\">we：</span>「（一般的に）私たち人間は」「（その文化に属する）我々は」という意味で、話し手を含む一般の人々を指します。</p>\n<div class=\"ex\"><b>We</b> should protect the environment. (私たちは環境を守るべきだ。＝一般論としての人々)</div>\n<p><span class=\"lbl\">they：</span>「（一般的に）人々は」「（特定の集団の）彼らは」という意味で使われます。</p>\n<div class=\"ex\"><b>They</b> say that laughter is the best medicine. (笑いは最良の薬だと言われている。＝世間一般でそう言われている)</div>\n<p><span class=\"lbl\">one：</span>形式張った表現で「（一般的に）人は」という意味を表します。</p>\n<div class=\"ex\"><b>One</b> must obey the traffic rules. (人は交通ルールを守らなければならない。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>指示代名詞による文脈指示 (this, that)</h3>\n<p><span class=\"lbl\">ポイント：</span>前の文や節の内容全体を受けて「そのこと」「これ」と指す場合に使われます。</p>\n<div class=\"ex\">He failed the exam. <b>This</b> surprised everyone. (彼は試験に落ちた。このことは皆を驚かせた。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>代名詞 so の用法</h3>\n<p><span class=\"lbl\">ポイント：</span>前の文の内容全体や一部を受けて、「そのように」「そう」という意味で使います。think, hope, believe, expect, say などの動詞の後ろでよく使われます。</p>\n<div class=\"ex\">\"Is he coming?\" \"I hope <b>so</b>.\" (「彼は来ますか？」「そう望みます[＝来るといいですね]。」)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>other / another / the other</h3>\n<p><span class=\"lbl\">another：</span>「（不特定多数の中の）もう一つ」「別の」 (an + other)。</p>\n<div class=\"ex\">I don't like this shirt. Show me <b>another</b>. (このシャツは好きじゃない。別のを見せてください。)</div>\n<p><span class=\"lbl\">the other：</span>「（2つのうちの）もう一方」「残り全部」。</p>\n<div class=\"ex\">I have two brothers. One is in Tokyo, and <b>the other</b> is in Osaka. (私には2人の兄弟がいる。1人は東京に、もう1人[＝残りの1人]は大阪にいる。)</div>\n<p><span class=\"lbl\">one another：</span>「お互いに」 (= each other)。</p>\n<div class=\"ex\">They help <b>one another</b>. (彼らは互いに助け合っている。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>不定代名詞 + 形容詞 (something / nothing etc.)</h3>\n<p><span class=\"lbl\">ポイント：</span>something, anything, nothing, somebody などを形容詞で修飾する場合、形容詞は後ろに置きます。</p>\n<div class=\"ex\">I want <b>something</b> cold to drink. (何か冷たい飲み物が欲しい。)</div>\n<p><span class=\"lbl\">the same：</span>「同じもの」「同様のこと」を指します。</p>\n<div class=\"ex\">I'll have <b>the same</b>. (私にも同じものをください。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 3-4 で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>数量を表す形容詞 (many / much, few / little)</h3>\n<p><span class=\"lbl\">many / few：</span>可算名詞（数えられる名詞）に使います。<br><b>many</b>：たくさんの<br><b>few</b>：（否定的に）ほとんどない<br><b>a few</b>：（肯定的に）少しある</p>\n<div class=\"ex\">There are <b>many</b> reasons to support this idea.（この考えを支持する理由はたくさんあります。）</div>\n<div class=\"ex\">There are <b>few</b> students in the classroom. (教室にはほとんど生徒がいません。)</div>\n<div class=\"ex\">There are <b>a few</b> students in the library.（図書館に何人かの学生がいる。）</div>\n<p><span class=\"lbl\">much / little：</span>不可算名詞（数えられない名詞）に使います。<br><b>much</b>：たくさんの（主に否定文・疑問文で使われますが、肯定文では a lot of が好まれます。ただし too much や so much の形では肯定文でもよく使われます）<br><b>little</b>：（否定的に）ほとんどない<br><b>a little</b>：（肯定的に）少しある</p>\n<div class=\"ex\">We don't have <b>much</b> time left. (私たちにはあまり時間が残されていません。)</div>\n<div class=\"ex\">I have <b>little</b> time today, so I can't talk long. (今日はほとんど時間がないので、長く話せません。)</div>\n<div class=\"ex\">I have <b>a little</b> time today, so we can talk for a few minutes. (今日は少し時間があるので、数分なら話せます。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>some と any</h3>\n<p><span class=\"lbl\">some：</span>通常、肯定文で使われます。「いくつかの」「ある～」</p>\n<p><span class=\"lbl\">any：</span>通常、否定文や疑問文で使われます。「いかなる～も（ない）」「いくつかの（～か？）」</p>\n<div class=\"ex\">I bought <b>some</b> apples. (私はいくつかリンゴを買いました。)</div>\n<div class=\"ex\">I didn't buy <b>any</b> oranges. (私はオレンジを一つも買いませんでした。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>very と much</h3>\n<p><span class=\"lbl\">very：</span>形容詞や副詞の原級、現在分詞（形容詞的）を修飾します。</p>\n<p><span class=\"lbl\">much：</span>動詞、過去分詞（形容詞的）、比較級、最上級を修飾します。</p>\n<div class=\"ex\">The story was <b>very</b> exciting. (その話はとても興奮させるものでした。)</div>\n<div class=\"ex\">I was <b>much</b> surprised (or very surprised) by the news. (私はその知らせにとても驚きました。)</div>\n<p><span class=\"lbl\">注意：</span>surprised, tired, pleased など形容詞化した過去分詞は very でも修飾可能です。受動態の動作を強調する場合は much が使われます。</p>\n<div class=\"ex\">Thank you <b>very much</b>. (本当にありがとう。※副詞としてのmuchを強調)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>関係代名詞+be動詞の省略（後置修飾）</h3>\n<p><span class=\"lbl\">ポイント：</span>名詞の後ろに 現在分詞 (-ing) や 過去分詞 (-ed)、または 形容詞句 が続く場合、その間に「関係代名詞 + be動詞」が省略されていると考えられます。</p>\n<div class=\"ex\">The painting <b>(which is)</b> displayed in the hall is famous. (ホールに展示されている絵は有名です。)</div>\n<div class=\"ex\">Do you know the girl <b>(who is)</b> talking to Tom? (トムと話しているあの女の子を知っていますか？)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>to不定詞の意味上の主語 (for/of A to do)</h3>\n<p><span class=\"lbl\">ポイント：</span>不定詞（to do）の動作主を明示する場合、直前に for A を置きます。人の性質を表す形容詞（kind, nice, cleverなど）が文の補語に来る場合は of A を使います。</p>\n<div class=\"ex\">It is necessary <b>for you to study</b> hard. (あなたが一生懸命勉強することは必要です。)</div>\n<div class=\"ex\">It was brave <b>of him to save</b> the child. (子供を助けるとは、彼は勇敢でした。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 3-5 で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>知覚動詞 + O + 原形不定詞 / 現在分詞</h3>\n<p><span class=\"lbl\">ポイント：</span>see, hear, feel, watch などの知覚動詞は、目的語(O)の後ろに動詞の原形（原形不定詞）または現在分詞(-ing)をとります。</p>\n<p><span class=\"lbl\">原形不定詞：</span>「Oが～するのを見る/聞く」（動作の最初から最後まで、または事実として）</p>\n<div class=\"ex\">I <b>saw</b> him <b>enter</b> the room. (私は彼が部屋に入るのを見ました。)</div>\n<p><span class=\"lbl\">現在分詞：</span>「Oが～しているのを見る/聞く」（動作の進行中の一瞬）</p>\n<div class=\"ex\">I <b>saw</b> him <b>entering</b> the room. (私は彼が部屋に入っていくところを見ました。)</div>\n<div class=\"ex\">I <b>heard</b> her <b>singing</b> in the shower. (私は彼女がシャワーで歌っているのを聞きました。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>使役動詞 + O + 原形不定詞 (make, have, let)</h3>\n<p><span class=\"lbl\">make + O + do：</span>「Oに（無理やり）～させる」（強制）</p>\n<div class=\"ex\">The teacher <b>made</b> us <b>do</b> extra homework. (先生は私たちに追加の宿題をさせました。)</div>\n<p><span class=\"lbl\">have + O + do：</span>「Oに～してもらう/（指示して）させる」（雇ってやってもらう、指示する）</p>\n<div class=\"ex\">I <b>had</b> him <b>cut</b> my hair. (彼に髪の毛をカットしてもらった)</div>\n<div class=\"ex\">I'll <b>have</b> my assistant <b>call</b> you. (アシスタントに電話させます。)</div>\n<p><span class=\"lbl\">let + O + do：</span>「Oに～させてやる」（許可）</p>\n<div class=\"ex\"><b>Let</b> me <b>know</b> if you need help. (助けが必要なら知らせてね。[私に知ることを許可して＝知らせて])</div>\n<p><span class=\"lbl\">get + O + to不定詞：</span>（説得）get は使役的な意味（～してもらう、～させる）で使えますが、後ろには原形ではなく to不定詞 が来ます。説得して～させるというニュアンスがあります。</p>\n<div class=\"ex\">I finally <b>got</b> him <b>to agree</b> with me. (私はついに彼を同意させました。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>help + O + (to) do</h3>\n<p><span class=\"lbl\">ポイント：</span>help は目的語の後ろに 原形不定詞 または to不定詞 の両方をとることができます。</p>\n<div class=\"ex\">This book <b>helped</b> me <b>(to) understand</b> the culture. (この本は私がその文化を理解するのに役立ちました。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>be + to不定詞 / It is + 形容詞 + to不定詞</h3>\n<p><span class=\"lbl\">ポイント：</span>be + to不定詞は「～することになっている」（予定）などを表します。It is + 形容詞（essential, important など）+ to不定詞 は、形式主語 it が後ろの to不定詞（「～すること」という名詞的用法）を指す形です。本文の To understand these nuances is essential ... は It is essential to understand these nuances ... と書き換えられます。</p>\n<div class=\"ex\">We <b>are to submit</b> the report by Friday.（私たちは金曜までにレポートを提出することになっています。）</div>\n<div class=\"ex\">It is <b>important to respect</b> other cultures. (他の文化を尊重することは重要です。)</div>\n<p><span class=\"lbl\">注意：</span>本文の to make the situation less awkward / to show genuine happiness / to appear modest は「～するために」と目的を表す副詞的用法です。</p>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 3-6 で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>関係副詞</h3>\n<p><span class=\"lbl\">ポイント：</span>先行詞（場所、時、理由、方法）を修飾する節を導きます。前置詞+関係代名詞（in whichなど）の代わりとして使われます。</p>\n<p><span class=\"lbl\">where：</span>場所を表す先行詞（the place, the house, the situationなど）につきます。</p>\n<div class=\"ex\">That is the park <b>where</b> we played soccer. (あれは私たちがサッカーをした公園です。)</div>\n<p><span class=\"lbl\">when：</span>時を表す先行詞（the time, the day, the yearなど）につきます。</p>\n<div class=\"ex\">I remember the day <b>when</b> we first met. (私は私たちが初めて会った日を覚えています。)</div>\n<p><span class=\"lbl\">why：</span>理由を表す先行詞（the reason）につきます。しばしば先行詞か関係副詞のどちらかが省略されます。</p>\n<div class=\"ex\">That is (the reason) <b>why</b> I was late. (それが私が遅刻した理由です。)</div>\n<p><span class=\"lbl\">how：</span>方法を表す先行詞（the way）につきますが、the way と how は一緒に使えません。どちらか一方を使います。</p>\n<div class=\"ex\">This is <b>how</b> he solved the problem. / This is <b>the way</b> he solved the problem. (これが彼が問題を解決した方法です。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>関係形容詞</h3>\n<p><span class=\"lbl\">which：</span>前の文の内容を受けて「そしてその～は...」とつなげる非制限用法で使われることがあります。which の後ろに名詞が続きます。</p>\n<div class=\"ex\">He said he was ill, <b>which</b> statement was false. (彼は病気だと言ったが、その言葉は嘘だった。)</div>\n<p><span class=\"lbl\">whose：</span>所有格の関係代名詞ですが、名詞を修飾する働きから関係形容詞的に分類されることもあります。</p>\n<div class=\"ex\">She's the student <b>whose</b> English improved the most this year.（彼女は、今年いちばん英語が伸びた生徒です。）</div>\n<p><span class=\"lbl\">注意：</span>本文の what kind of gift would make you happy? の what は、疑問文の中で名詞（kind）を修飾する疑問形容詞「どんな～」です。関係形容詞の what（I gave him what money I had.「持っていたお金を全部彼にあげた」）とは区別しましょう。</p>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>条件文における直説法と仮定法</h3>\n<p><span class=\"lbl\">直説法（現在の事実・可能性が高い未来）：</span>If + S + 現在形, S + will/can/may + 原形</p>\n<div class=\"ex\">If it <b>rains</b> tomorrow, I <b>will</b> stay home. (もし明日雨が降れば、私は家にいます。[降る可能性がある])</div>\n<p><span class=\"lbl\">仮定法過去（現在の事実に反する仮定・可能性が低い未来）：</span>If + S + 過去形, S + would/could/might + 原形</p>\n<div class=\"ex\">If I <b>had</b> a car, I <b>would</b> drive you there. (もし車を持っていれば[実際は持っていない]、あなたをそこへ送っていくのですが。)</div>\n<div class=\"ex\">If I <b>were</b> you, I <b>wouldn't</b> do that. (もし私があなたなら[あり得ない]、そんなことはしないでしょう。)</div>\n</div>",

 "trans": [

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されている主な文法項目（Lesson 4-0に準拠）を解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>文の要素と品詞</h3>\n<p><span class=\"lbl\">ポイント：</span>英語の文は主語(S)と動詞(V)が中心です。主語（誰が/何が）述語（どうする/どんな状態か）。</p>\n<div class=\"ex\"><b>Reading books</b> <b>is</b> important for students. (読書は学生にとって重要だ。)</div>\n<div class=\"ex\"><b>Small words</b> <b>carry</b> big meanings. (小さな語は大きな意味を持っている。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>助動詞</h3>\n<p><span class=\"lbl\">ポイント：</span>動詞に意味（可能性、能力、義務など）を添えます。</p>\n<p><span class=\"lbl\">パッセージ例：</span>you <b>should</b> use \"Hi\"... （「～すべきだ」という提案・アドバイス）<b>、</b>silence <b>can</b> feel uncomfortable... （「～でありうる」という可能性）</p>\n<div class=\"ex\">We <b>must</b> follow the traffic rules. (私たちは交通ルールを守らなければならない。)</div>\n<div class=\"ex\">It <b>will</b> snow next week. (来週は雪になります。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>準動詞：動名詞</h3>\n<p><span class=\"lbl\">ポイント：</span>動詞を名詞として扱います（～すること）。主語や前置詞の目的語になります。</p>\n<div class=\"ex\"><b>Cutting trees</b> is very dangerous. (木を切ることは大変危険です。)※主語がcuttingでtreesではないので動詞は単数isで受けています。</div>\n<div class=\"ex\">He is good at <b>playing the guitar</b>. (彼はギターを弾くのが得意だ。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>準動詞：不定詞</h3>\n<p><span class=\"lbl\">ポイント：</span>名詞用法、形容詞用法、副詞用法があります。</p>\n<div class=\"ex\"><b>To live</b> is <b>to fight</b>. (生きることは戦いだ。―主語、補語の名詞用法)</div>\n<div class=\"ex\">We have no money <b>to buy</b> this. (私たちはこれを買うお金はない。― moneyを修飾の形容詞用法)</div>\n<div class=\"ex\">She went to the library <b>to study</b> English. (彼女は英語を勉強するために図書館へ行った。― 動詞を修飾の副詞用法)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>比較</h3>\n<p><span class=\"lbl\">ポイント：</span>原級、比較級、最上級があります。</p>\n<div class=\"ex\">California is almost <b>as big as</b> Japan. (カリフォルニアは日本とほとんど同じ大きさです。)</div>\n<div class=\"ex\">This computer is <b>more expensive than</b> that one. (このコンピュータはあれよりも高い。―比較級)</div>\n<div class=\"ex\">He is <b>the best student</b> in his class. (彼はクラスで最も優秀な生徒です。)</div>\n</div>\n<div class=\"gi\" id=\"gi6\">\n      <h3><span class=\"n\">6</span>接続詞</h3>\n<p><span class=\"lbl\">ポイント：</span>文と文、語と語をつなぎます。</p>\n<div class=\"ex\">I was tired, <b>but</b> I finished my homework. (疲れていたが、宿題を終わらせた。)</div>\n<div class=\"ex\">I knew <b>that</b> he was alive. (彼が生存していることは知っていた。― that以下が動詞knewの目的語の名詞節)</div>\n<div class=\"ex\">This is the PC <b>that</b> I bought yesterday. (これが私が昨日買ったPCです。― that以下がthe PCを修飾する形容詞節)</div>\n<div class=\"ex\">I would go to college <b>if</b> I had enough money. (もし十分にお金があれば大学に行くんだが。― if以下が動詞を修飾する副詞節)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されているLesson 4-1の主な文法項目を解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>関係副詞</h3>\n<p><span class=\"lbl\">ポイント：</span>場所、時、理由、方法を表す副詞節を導き、先行詞（名詞）を修飾します。</p>\n<p><span class=\"lbl\">where（場所）：</span>先行詞が場所の場合に使います。</p>\n<div class=\"ex\">This is the park <b>where</b> I used to play soccer. (ここは私がかつてサッカーをした公園です。)</div>\n<p><span class=\"lbl\">when（時）：</span>先行詞が時の場合に使います。</p>\n<div class=\"ex\">I remember the day <b>when</b> we first met. (私は私たちが初めて会った日を覚えています。)</div>\n<p><span class=\"lbl\">why（理由）：</span>先行詞が the reason の場合に使います。</p>\n<div class=\"ex\">Please tell me the reason <b>why</b> you are late. (あなたが遅れた理由を教えてください。)</div>\n<p><span class=\"lbl\">how（方法）：</span>the way と how は一緒に使えないため、どちらか一方を使います。</p>\n<div class=\"ex\">This is <b>how</b> he solved the problem. (これが彼がその問題を解決した方法です。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>関係形容詞</h3>\n<p><span class=\"lbl\">ポイント：</span>whose, which, what などの関係詞が、すぐ後ろの名詞を修飾する形容詞のように働きながら節を導く用法です。</p>\n<div class=\"ex\">I talked to a student <b>whose father</b> works in Australia. (私は、お父さんがオーストラリアで働いている生徒と話しました。)</div>\n<div class=\"ex\">I gave her <b>what little money</b> I had. (私は持っていたわずかなお金をすべて彼女にあげた。)</div>\n<p><span class=\"lbl\">in which case：</span>「前置詞 + which + 名詞」の形で、前の文の内容を受けて「その場合には～」と補足説明を加えます。</p>\n<div class=\"ex\">It may rain tomorrow, <b>in which case</b> the picnic will be canceled. (明日は雨が降るかもしれません。その場合、ピクニックは中止になります。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>未来完了形</h3>\n<p><span class=\"lbl\">ポイント：</span>will have + 過去分詞: 未来のある時点までに「完了しているだろう」「（ずっと）～していることになる」などを表します。</p>\n<div class=\"ex\">By next month, I <b>will have finished</b> reading this book. (来月までには、私はこの本を読み終えているでしょう。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>過去完了形</h3>\n<p><span class=\"lbl\">ポイント：</span>had + 過去分詞: 過去のある時点よりも「さらに前（大過去）」に起こったことや、過去のある時点までの完了・継続・経験を表します。</p>\n<div class=\"ex\">When I arrived at the station, the train <b>had already left</b>. (私が駅に着いた時、電車はすでに出発していました。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>未来進行形</h3>\n<p><span class=\"lbl\">ポイント：</span>will be + -ing: 未来のある時点で「（ちょうど）～しているだろう」という進行中の動作や未来の予定を表します。</p>\n<div class=\"ex\">At this time tomorrow, I <b>will be flying</b> to London. (明日の今頃、私はロンドンへ向けて飛行機に乗っているでしょう。)</div>\n<div class=\"ex\">We <b>will be arriving</b> at Tokyo in one hour. (１時間で東京駅に到着することになっております。)</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されているLesson 4-2の主な文法項目を解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>条件文：直説法と仮定法</h3>\n<p><span class=\"lbl\">直説法：</span>現実的な条件や単なる仮定を表します。時制は通常のルールに従います（未来のことでも条件節内は現在形）。</p>\n<div class=\"ex\">If the negotiation <b>goes</b> well, we <b>will</b> sign the contract tomorrow. (もし交渉がうまくいけば、明日契約書にサインします。)</div>\n<p><span class=\"lbl\">仮定法：</span>事実に反することや、可能性の低い仮定（仮想）を表します。</p>\n<div class=\"ex\">If I <b>had</b> more time, I <b>would</b> help you.（もしもっと時間があれば、あなたを手伝うのに。）</div>\n<p><span class=\"lbl\">仮定法過去完了：</span>過去の事実に反する仮定です。「If + S + had + p.p., S + would/could + have + p.p.」</p>\n<div class=\"ex\">If I <b>had</b> <b>accepted</b> the job offer in London, I <b>would</b> <b>have moved</b> there last year. (もしロンドンでの仕事のオファーを受けていたら、昨年そちらへ引っ越していただろう。)</div>\n<p><span class=\"lbl\">注意：</span>「（過去に～していたら）今頃～しているだろう」と、結果が現在の事実に反する場合は、帰結節を仮定法過去にします（混合仮定法）。</p>\n<div class=\"ex\">If I <b>had accepted</b> the job offer in London, I <b>would be</b> working there now. (もしロンドンでの仕事のオファーを受けていたら、今頃そこで働いているだろう。)</div>\n<p><span class=\"lbl\">If S were to do：</span>実現可能性が低い未来の仮定。「万一～なら」</p>\n<div class=\"ex\">If the price <b>were to rise</b>, we <b>would</b> have to reconsider our budget. (万一価格が上昇するようなことがあれば、予算を再検討しなければならないだろう。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>句動詞</h3>\n<p><span class=\"lbl\">ポイント：</span>「動詞 + 副詞 (+ 前置詞)」の組み合わせで特定の意味を持ちます。</p>\n<p><span class=\"lbl\">自動詞的：</span>そのまま目的語を取らずに使ったり、前置詞を伴って使います。look into (調査する), run into (遭遇する), deal with (対処する), keep up with (ついていく)</p>\n<div class=\"ex\">We need to <b>look into</b> the cause of the delay. (遅延の原因を調査する必要がある。)</div>\n<p><span class=\"lbl\">他動詞的：</span>目的語を取ります。動詞と副詞は基本的に分離可能で、目的語が代名詞の場合は必ず間に挟みます（set it up ○／set up it ×）。set up (設立する), build up (築き上げる)</p>\n<div class=\"ex\">They <b>set</b> a new office <b>up</b> in Shanghai. (彼らは上海に新しいオフィスを設立した。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>倍数表現</h3>\n<p><span class=\"lbl\">ポイント：</span>「AはBのX倍だ」という表現です。「X times as + 形容詞/副詞 + as」や「X times the + 名詞 + of」などの形があります。</p>\n<div class=\"ex\">Our market share is <b>four times as large as</b> theirs. (我々の市場シェアは彼らの4倍だ。)</div>\n<div class=\"ex\">The new model has <b>twice the battery life of</b> the old one.（新モデルは旧モデルの2倍の電池持ちだ。）</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>その他の法助動詞</h3>\n<p><span class=\"lbl\">ought to：</span>「～すべきだ」「～したほうがよい」（shouldに近い）。義務や当然の推量を表します。</p>\n<div class=\"ex\">You <b>ought to</b> verify the data before the presentation. (プレゼンの前にデータを検証すべきだ。)</div>\n<p><span class=\"lbl\">need：</span>助動詞として使う場合（主に否定文・疑問文）と、一般動詞として使う場合があります。否定文での need not have + p.p. は「～する必要はなかったのに（してしまった）」を表します。</p>\n<div class=\"ex\">You <b>need</b> not have sent the package by express mail. (速達で荷物を送る必要はなかったのに。)</div>\n<p><span class=\"lbl\">dare：</span>「あえて～する」「～する勇気がある」。助動詞としても一般動詞としても使われます。</p>\n<div class=\"ex\">He <b>dared</b> not speak against the chairman. (彼はあえて会長に反対意見を言おうとはしなかった。)</div>\n<div class=\"ex\">Do you <b>dare</b> to ask him directly? (彼に直接頼む勇気ある？)</div>\n</div>",

  "しかし、それらを入手することは大きな課題です。地殻全体に広く分布してはいますが、採算が取れるほど高濃度で見つかることはめったにありません。それらを抽出し精製することもまた、困難で汚染を伴う作業です。分離プロセスで強力な化学薬品を使用するため、採掘施設はしばしば環境面での批判に直面します。ひとたび土壌や水中に放出されると、これらの有毒物質は地元の生態系に長期的な損害を与える可能性があります。",
  "仮に主要生産国からの供給が突然絶たれたとしたらどうなるでしょうか。世界経済は深刻な危機に直面するでしょう。そのため、貿易戦争や地政学的な緊張が市場を混乱させる場合に備えて、多くの国が現在これらの資源を備蓄しています。たとえレアアースの価格が高騰したとしても、需要がすぐに落ち込むことはなさそうです。グリーンエネルギーへの移行に伴い、これらの鉱物への依存度は高まる一方であるかのように見えます。",

 "grammarNote": "if節以外の条件文・分詞構文",
 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されているLesson 4-3の主な文法項目「if以外の条件文」と「副詞節の簡略化（分詞構文）」について解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>if 以外の条件文</h3>\n<p>if 以外にも条件や仮定を表す接続詞・表現があります。</p>\n<p><span class=\"lbl\">unless：</span>「～しない限り」「もし～でなければ」<br>否定の条件を表します。except on the condition that（～という条件を除いては）というニュアンスです。</p>\n<div class=\"ex\">You will fail the exam <b>unless</b> you study harder. (もっと一生懸命勉強しない限り、試験に落ちるだろう。)</div>\n<p><span class=\"lbl\">Suppose / Supposing：</span>「もし～なら」「～と仮定すると」<br>提案や仮定の話を切り出す際に使われます。文頭に置くことが多いです。</p>\n<div class=\"ex\"><b>Suppose</b> you won the lottery, what would you buy? (もし宝くじが当たったら、何を買いますか？)</div>\n<p><span class=\"lbl\">in case：</span>「～する場合に備えて」「もし～なら（万一の備え）」<br>「～するといけないから準備する」という予防的な意味合いが強いです。</p>\n<div class=\"ex\">Take an umbrella <b>in case</b> it rains. (雨が降るといけないから、傘を持って行きなさい。)</div>\n<p><span class=\"lbl\">even if：</span>「たとえ～だとしても」<br>事実がどうであれ、結果は変わらないという譲歩の条件を表します。</p>\n<div class=\"ex\">I will go <b>even if</b> it snows. (たとえ雪が降っても私は行きます。)</div>\n<p><span class=\"lbl\">as if / as though：</span>「まるで～かのように」<br>事実とは異なること（仮定法）や、様子（直説法）を表すのに使います。</p>\n<div class=\"ex\">He speaks <b>as if</b> he knew everything. (彼はまるで全てを知っているかのように話す。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>副詞節を分詞を使って副詞句へ簡略化（分詞構文）</h3>\n<p><span class=\"lbl\">ポイント：</span>接続詞＋主語＋動詞（副詞節）を、分詞を用いて簡潔なフレーズ（副詞句）にする用法です。</p>\n<p><span class=\"lbl\">現在分詞 (-ing)：</span>能動の意味（～して、～なので、～しながら）</p>\n<div class=\"ex\"><b>Walking</b> down the street, I met an old friend. (通りを歩いているとき、旧友に会った。)</div>\n<p><span class=\"lbl\">過去分詞 (-ed)：</span>受動の意味（～されて、～されると）</p>\n<div class=\"ex\"><b>Written</b> in simple English, this book is easy to understand. (簡単な英語で書かれているので、この本は理解しやすい。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>接続詞 + 分詞</h3>\n<p><span class=\"lbl\">ポイント：</span>意味を明確にするために接続詞を残すパターンです。</p>\n<div class=\"ex\"><b>While waiting</b> for the bus, I read a book. (バスを待っている間、本を読んだ。)</div>\n</div>",
