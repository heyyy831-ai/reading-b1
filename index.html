 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されているLesson 4-4の主な文法項目を解説します。「wh語 + ever」の形で、名詞節（～するものは誰でも／何でも）や副詞節（たとえ～しようとも）を作ります。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>複合関係詞</h3>\n<p><span class=\"lbl\">what (= the thing which)：</span>先行詞を含み「～するもの／こと」という意味になります。</p>\n<div class=\"ex\">Show me <b>what</b> you bought yesterday. (昨日買ったものを見せて。)</div>\n<div class=\"ex\"><b>What</b> makes him different is his creativity. (彼を他と違ったものにしているのは、彼の創造性だ。)</div>\n<p><span class=\"lbl\">wherever：</span>「～するどこでも」「どこで～しようとも」<br>譲歩や場所を表します。</p>\n<div class=\"ex\"><b>Wherever</b> you hide, I will find you. (あなたがどこに隠れようとも、私は見つけ出します。)</div>\n<div class=\"ex\">I will follow you <b>wherever</b> you go. (あなたがどこへ行こうとも、私はついていきます。)</div>\n<p><span class=\"lbl\">whatever：</span>「～するものは何でも」「何が～しようとも」<br>名詞節または譲歩の副詞節を作ります。</p>\n<div class=\"ex\">You can order <b>whatever</b> you like from the menu. (メニューから好きなものを何でも注文できます。[名詞節])</div>\n<div class=\"ex\"><b>Whatever</b> happens, I will stay by your side. (何が起きようとも、私はあなたのそばにいます。[副詞節])</div>\n<p><span class=\"lbl\">whoever：</span>「～する人は誰でも」<br>名詞節を作ります。</p>\n<div class=\"ex\"><b>Whoever</b> arrives first will receive a prize. (最初に到着した人は誰でも賞品をもらえます。)</div>\n<div class=\"ex\">You can give this ticket to <b>whoever</b> wants it. (このチケットは欲しい人なら誰にあげてもいいよ。)</div>\n<p><span class=\"lbl\">whichever：</span>「どちらでも」「どれでも」<br>名詞節を作ります。</p>\n<div class=\"ex\">Choose <b>whichever</b> you like best. (一番好きなものをどれでも選んでいいよ。)</div>\n<p><span class=\"lbl\">whenever：</span>「～するときはいつでも」「いつ～しようとも」<br>副詞節を作ります。</p>\n<div class=\"ex\">Come and see me <b>whenever</b> you like. (いつでも好きなときに会いに来てください。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>不定詞の慣用表現</h3>\n<p><span class=\"lbl\">in order to do：</span>「～するために」<br>目的を表します。</p>\n<div class=\"ex\">He woke up early <b>in order to</b> catch the first train. (彼は始発に乗るために早起きした。)</div>\n<p><span class=\"lbl\">so as not to do：</span>「～しないように」<br>否定の目的を表します。</p>\n<div class=\"ex\">She walked quietly <b>so as not to</b> wake the baby. (彼女は赤ちゃんを起こさないように静かに歩いた。)</div>\n<p><span class=\"lbl\">too ... to do：</span>「あまりに…なので～できない」<br>程度を表します。</p>\n<div class=\"ex\">This box is <b>too heavy</b> for me <b>to carry</b>. (この箱は重すぎて私には運べない。)</div>\n<p><span class=\"lbl\">enough to do：</span>「～するのに十分…」<br>程度を表します。</p>\n<div class=\"ex\">He is old <b>enough to drive</b> a car. (彼は車を運転できる年齢だ。)</div>\n<p><span class=\"lbl\">To tell the truth：</span>「実を言うと」<br>独立不定詞の一つです。</p>\n<div class=\"ex\"><b>To tell the truth</b>, I forgot your birthday. (実を言うと、君の誕生日を忘れていたんだ。)</div>\n<p><span class=\"lbl\">Why not do?：</span>「～したらどう？」<br>提案を表します。</p>\n<div class=\"ex\"><b>Why not ask</b> him for help? (彼に助けを求めたらどう？)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>動名詞の慣用表現</h3>\n<p><span class=\"lbl\">It is no use doing：</span>「～しても無駄だ」</p>\n<div class=\"ex\"><b>It is no use trying</b> to convince him. (彼を説得しようとしても無駄だ。)</div>\n<p><span class=\"lbl\">cannot help doing：</span>「～せずにはいられない」</p>\n<div class=\"ex\">I <b>cannot help laughing</b> at his jokes. (彼の冗談には笑わずにはいられない。)※cannot help but laugh も可。</div>\n<p><span class=\"lbl\">without doing：</span>「～せずに」</p>\n<div class=\"ex\">He left <b>without saying</b> goodbye. (彼はさよならも言わずに立ち去った。)</div>\n<p><span class=\"lbl\">Generally speaking：</span>「一般的に言えば」<br>独立分詞構文（慣用的な表現として扱われます）。</p>\n<div class=\"ex\"><b>Generally speaking</b>, women live longer than men. (一般的に言えば、女性は男性より長生きする。)</div>\n<p><span class=\"lbl\">feel like -ing：</span>「～したい気分だ」</p>\n<div class=\"ex\">I <b>feel like going</b> for a drive. (ドライブに行きたい気分だ。)</div>\n<p><span class=\"lbl\">Would you mind -ing?：</span>「～していただけませんか？」</p>\n<div class=\"ex\"><b>Would you mind lowering</b> your voice? (声を落としていただけませんか？)</div>\n<p><span class=\"lbl\">動名詞の意味上の主語：</span>動名詞の直前に所有格（または目的格）を置いて、動作主を示します。Would you mind my -ing? は「（私が）～してもいいですか？」の意味になります。</p>\n<div class=\"ex\">Would you mind <b>my opening</b> the window? (窓を開けてもよろしいですか？)</div>\n<div class=\"ex\">I apologize for <b>my dog making</b> so much noise. (うちの犬がうるさくして申し訳ありません。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>冠詞の注意点</h3>\n<p><span class=\"lbl\">a/an の語順：</span>so / too / as / how ＋形容詞＋a＋名詞<br>形容詞が副詞に修飾される際、冠詞の位置が変わるので語順に注意が必要です。</p>\n<div class=\"ex\">It was <b>so beautiful a day</b> that we went for a picnic. (あまりに美しい日だったのでピクニックに行った。)</div>\n<div class=\"ex\">He is <b>too honest a man</b> to tell a lie. (彼は嘘をつくには正直すぎる男だ。)</div>\n<p><span class=\"lbl\">the＋発明品・機器：</span>「～というもの」として総称的に表す場合。</p>\n<div class=\"ex\">Who invented <b>the computer</b>? (誰がコンピュータを発明したのですか？)</div>\n<p><span class=\"lbl\">the＋体の部分：</span>「動詞＋人＋前置詞＋the＋体の部分」の形をとります。</p>\n<div class=\"ex\">He patted me on <b>the shoulder</b>. (彼は私の肩をぽんと叩いた。)</div>\n<div class=\"ex\">The police officer seized the thief by <b>the collar</b>. (警察官は泥棒の襟首をつかんだ。)</div>\n<p><span class=\"lbl\">the をつける名詞・つけない名詞：</span>楽器・通信（the をつける）：play the violin, on the phone<br>スポーツ・食事・本来の目的の場所（無冠詞）：play tennis, have lunch, go to school（勉強しに行く）</p>\n<div class=\"ex\">Can you <b>play the guitar</b>? (ギターは弾けますか？)</div>\n<div class=\"ex\">They like to <b>play baseball</b> after school. (彼らは放課後に野球をするのが好きだ。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>比較級・最上級と the</h3>\n<p><span class=\"lbl\">The 比較級 ..., the 比較級 ...：</span>「～すればするほど、ますます…」</p>\n<div class=\"ex\"><b>The more</b> you practice, <b>the better</b> you will become. (練習すればするほど、上手になります。)</div>\n<p><span class=\"lbl\">the＋最上級：</span>副詞の最上級の場合は the を省略できます。</p>\n<div class=\"ex\">She runs <b>(the) fastest</b> in our class. (彼女はクラスで一番速く走る。)</div>\n</div>",

 "trans": [

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">Lesson 4-5 で扱われている文法ポイントの解説です。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>命令形 + and / or</h3>\n<p><span class=\"lbl\">ポイント：</span>命令形の後に接続詞を続けることで、条件と結果を表します。</p>\n<p><span class=\"lbl\">命令文 + and：</span>「～しなさい、そうすれば…」（肯定的な結果）</p>\n<p><span class=\"lbl\">命令文 + or：</span>「～しなさい、さもないと…」（否定的な結果・警告）</p>\n<p><span class=\"lbl\">解説：</span>If を使った条件節の代わりによく使われる、生き生きとした表現です。</p>\n<div class=\"ex\"><b>Turn right</b> at the corner, <b>and</b> you will find the station. (角を右に曲がりなさい、そうすれば駅が見つかりますよ。)</div>\n<div class=\"ex\"><b>Hurry up</b>, <b>or</b> you will miss the last train. (急ぎなさい、さもないと終電に乗り遅れますよ。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>Let's / Let me</h3>\n<p><span class=\"lbl\">ポイント：</span>提案や勧誘を表します。Let's face it（現実を見よう／正直になろう）などの慣用表現も重要です。</p>\n<div class=\"ex\"><b>Let's</b> discuss this matter later. (この件については後で話し合いましょう。)</div>\n<div class=\"ex\"><b>Let</b> me introduce myself. (自己紹介をさせてください。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>否定表現 (Neither A nor B / Either A or B / No one)</h3>\n<p><span class=\"lbl\">Neither A nor B：</span>「AもBも～ない」。両方を否定します。主語に来る場合、動詞はB（動詞に近い方）に合わせるのが原則です。</p>\n<p><span class=\"lbl\">Either A or B：</span>「AかBか」。</p>\n<p><span class=\"lbl\">No one：</span>「誰も～ない」。単数扱いになることに注意が必要です。</p>\n<div class=\"ex\"><b>Neither</b> my brother <b>nor</b> my parents like spicy food. (兄も両親も辛い食べ物は好きではありません。)</div>\n<div class=\"ex\"><b>Either</b> you <b>or</b> Tom must go there. (君かトムがそこに行かなければならない。)</div>\n<div class=\"ex\"><b>No one</b> knows the secret recipe. (誰もその秘密のレシピを知りません。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>部分否定 (not necessarily)</h3>\n<p><span class=\"lbl\">ポイント：</span>not の後に necessarily, always, all などを伴うと、「必ずしも～というわけではない」という部分否定になります。</p>\n<div class=\"ex\">Rich people are <b>not necessarily</b> happy. (お金持ちが必ずしも幸せとは限りません。)</div>\n</div>\n<div class=\"gi\" id=\"gi5\">\n      <h3><span class=\"n\">5</span>語形成 (un-, -less)</h3>\n<p><span class=\"lbl\">ポイント：</span>接頭辞 un-（否定）や接尾辞 -less（～がない）をつけることで、反対の意味や欠如を表す形容詞を作ります。</p>\n<div class=\"ex\">It was <b>unfair</b> to blame him. (彼を責めるのは不公平だった。)</div>\n<div class=\"ex\">This <b>wireless</b> mouse is very convenient. (このワイヤレスマウスはとても便利だ。)</div>\n</div>\n<div class=\"gi\" id=\"gi6\">\n      <h3><span class=\"n\">6</span>同意を求める付加疑問文</h3>\n<p><span class=\"lbl\">ポイント：</span>否定形を使っての同意表現です。</p>\n<div class=\"ex\">It's really cold today. ― <b>Isn't it!</b> (今日は本当に寒いね。―そうだね！)</div>\n<div class=\"ex\">Those apps always update at the worst possible time. ― <b>Don't they!</b> (あのアプリって、いつも最悪のタイミングでアップデートするね。―そうだね！)</div>\n<div class=\"ex\">She's really hardworking. ― <b>Isn't she, though?</b> (彼女って本当に努力家だよね。―本当にそうだよね。)※ though は「全く、本当に」の意味の副詞。</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されているLesson 4-6の主な文法項目を解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>不定詞のその他の注意点</h3>\n<p><span class=\"lbl\">ポイント：</span>be + to 不定詞：予定、運命、義務、意図、可能などを表します。</p>\n<p><span class=\"lbl\">例：</span></p>\n<div class=\"ex\">if we <b>are to protect</b> ... (もし私たちが～するつもりなら：意図)</div>\n<div class=\"ex\">We <b>are to meet</b> these challenges ... (私たちは～しなければならない：義務/当然)</div>\n<div class=\"ex\">The President <b>is to visit</b> Japan next month. (大統領は来月日本を訪問する予定だ。)</div>\n<div class=\"ex\">We <b>are to meet</b> these targets within three months.（私たちは3か月以内にこれらの目標を達成することになっている。）</div>\n<p><span class=\"lbl\">seem + to 不定詞：</span>「～するように見える・思われる」という推量を表します。</p>\n<div class=\"ex\">He <b>seems to know</b> the answer. (彼は答えを知っているようだ。)</div>\n<p><span class=\"lbl\">代不定詞：</span>直前の動詞の繰り返しを避けるため、to だけを残す用法です。</p>\n<div class=\"ex\">You can come if you want <b>to</b>. (来たければ来てもいいよ。)</div>\n<p><span class=\"lbl\">独立不定詞：</span>文全体を修飾する慣用的な表現です。</p>\n<div class=\"ex\"><b>To tell the truth</b>, I don't like natto. (実を言うと、私は納豆が好きではない。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>中間の態</h3>\n<p><span class=\"lbl\">ポイント：</span>形は能動態ですが、意味は受動態（～される）に近い動詞の用法です。主語の性質を表す際によく使われます。</p>\n<div class=\"ex\">This shirt <b>washes</b> well. (このシャツはよく洗える＝洗濯がきく。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>感情の形容詞 (-ing, -ed タイプ)</h3>\n<p><span class=\"lbl\">ポイント：</span>感情を表す動詞から派生した形容詞です。人が感情を「受ける」場合は過去分詞(-ed)、物事が感情を「与える」場合は現在分詞(-ing)を使います。</p>\n<div class=\"ex\">I was <b>bored</b> because the movie was <b>boring</b>. (映画が退屈だったので、私は退屈した。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>前置詞的に用いられる句</h3>\n<p><span class=\"lbl\">ポイント：</span>2語以上で一つの前置詞のような働きをする表現です。<br><b>According to</b>：～によると<br><b>Due to / Owing to</b>：～のために（原因・理由）<br><b>In spite of</b>：～にもかかわらず<br><b>Instead of</b>：～の代わりに<br><b>Thanks to</b>：～のおかげで（良い理由に使われることが多い）</p>\n<div class=\"ex\"><b>According to</b> the weather report, it will rain tomorrow.（天気予報によると、明日は雨です。）</div>\n<div class=\"ex\">The game was cancelled <b>due to</b> the rain. (雨のために試合は中止になった。)</div>\n<div class=\"ex\"><b>Owing to</b> a mistake, the meeting was postponed.（手違いのため、会議は延期されました。）</div>\n<div class=\"ex\"><b>In spite of</b> the rain, we went hiking.（雨にもかかわらず、私たちはハイキングに行きました。）</div>\n<div class=\"ex\"><b>Instead of</b> taking the train, I walked home.（電車に乗る代わりに、歩いて帰りました。）</div>\n<div class=\"ex\"><b>Thanks to</b> your help, I finished on time.（あなたのおかげで、時間通りに終えられました。）</div>\n</div>",

 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されているLesson 4-7の主な文法項目を解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>全否定・部分否定・準否定</h3>\n<p><span class=\"lbl\">全否定：</span>no, none, never, not ... any などで「すべて（まったく）～ない」を表します。</p>\n<div class=\"ex\"><b>None</b> of the students passed the test. (その試験に合格した生徒は一人もいなかった。)</div>\n<p><span class=\"lbl\">部分否定：</span>not + all, every, necessarily, always などで、「すべてが～というわけではない（～なものもあれば、そうでないものもある）」を表します。</p>\n<div class=\"ex\">Rich people are <b>not always</b> happy. (お金持ちが必ずしも幸せとは限らない。)</div>\n<div class=\"ex\"><b>Not all</b> countries are equally prepared for the effects of climate change.（すべての国が気候変動の影響に備えられているわけではない。）</div>\n<div class=\"ex\">Working from home is <b>not necessarily</b> the ultimate solution for productivity.（在宅勤務が、生産性にとって必ずしも究極の解決策とは限らない。）</div>\n<p><span class=\"lbl\">準否定：</span>hardly, scarcely（程度がほとんどない）、seldom, rarely（頻度がめったにない）、few, little（数が/量がほとんどない）など。否定語 not を使わずに否定的な意味を表します。</p>\n<div class=\"ex\">He has <b>little</b> money. (彼はお金をほとんど持っていない。)</div>\n<div class=\"ex\"><b>Hardly</b> a day passes without people checking the weather on their phones.（天気をスマホで確認する人がいない日は、ほとんどない。）</div>\n<div class=\"ex\"><b>Seldom</b> do we see such honesty in politics.（政治の世界で、これほどの正直さを見ることはめったにない。）</div>\n<p><span class=\"lbl\">強い否定：</span>far from（～どころではない、決して～ない）</p>\n<div class=\"ex\">The result was <b>far from</b> satisfactory. (結果は満足いくものからは程遠かった。)</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>倒置</h3>\n<p><span class=\"lbl\">否定語・準否定語が文頭に来るケース：</span>強調のために Never, Little, Seldom, Not only などの否定語を文頭に置くと、後ろは疑問文の語順（助動詞/be動詞 + S）になります。</p>\n<div class=\"ex\"><b>Never have I seen</b> such a beautiful sunset. (こんなに美しい夕日は一度も見たことがない。)</div>\n<div class=\"ex\"><b>Little did I realize</b> how difficult the test would be.（そのテストがどれほど難しいか、私はほとんど分かっていなかった。）</div>\n<p><span class=\"lbl\">if を省略するケース (仮定法)：</span>仮定法の if を省略すると、倒置（疑問文の語順）が起きます。</p>\n<div class=\"ex\"><b>Were</b> I you, I would apologize immediately.（もし私があなたなら、すぐに謝ります。）</div>\n<div class=\"ex\"><b>Should</b> it rain tomorrow, the event will be canceled.（万一明日雨が降れば、そのイベントは中止になります。）</div>\n<div class=\"ex\"><b>Had I known</b> the truth, I would have told you. (もし真実を知っていたら、君に話していただろうに。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>受動態の注意点</h3>\n<p><span class=\"lbl\">ポイント：</span>受動態の現在進行形：be being + 過去分詞 で「（今まさに）～されているところだ」を表します。</p>\n<div class=\"ex\">The new stadium <b>is being built</b> now. (新しいスタジアムは今、建設中だ。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>形容詞の注意点</h3>\n<p><span class=\"lbl\">ポイント：</span>過去分詞からの形容詞化：動詞の過去分詞が形容詞として定着したもの。</p>\n<div class=\"ex\">We are <b>used/accustomed</b> to working online.（私たちはオンラインで働くことに慣れている。）※ used + to不定詞だと「過去の習慣」(I used to play baseball.（かつて野球をしていた。）)</div>\n<p><span class=\"lbl\">複合形容詞：</span>2語以上がハイフンで結ばれて1つの形容詞を作るもの。</p>\n<div class=\"ex\">This is a <b>hands-on</b> experience. (これは実地体験だ。)</div>\n<div class=\"ex\">A <b>well-known</b> singer will perform at our school festival next month.（有名な歌手が来月、私たちの学園祭で歌います。）</div>\n<div class=\"ex\">Writing the report was a <b>time-consuming</b> task for the whole team.（そのレポートを書くのは、チーム全体にとって時間のかかる作業でした。）</div>\n</div>",

  "一方で、一部の地元住民は自分たちのコミュニティの変化について深く懸念しています。彼らは失礼だと思われたくないため、公に本音を話すことを恐れているかもしれません。しかし、内心では伝統的な文化や地元の職を失うことを恐れている可能性があります。彼らは「もし社会制度が全員を支えきれなかったらどうなるのか？」や「どうして政府は彼らを優先しているのか？」といった疑問を投げかけます。",
  "未知のものに対して不安を抱くのは全く自然なことです。私の考えでは、問題はしばしばコミュニケーション不足にあります。要するに、双方が安全で豊かな社会を望んでいるのです。ひょっとすると、人々がもっと注意深く互いの話を聞けば、思っている以上に共通点があることに気づくかもしれません。全員を即座に満足させることはかなり難しいですが、理解することが第一歩です。"

 "grammarNote": "不定詞と動名詞の両方可の形容詞",
 "grammar": "<p class=\"lead\" style=\"margin:0 0 6px\">このパッセージで使用されているLesson 4-8の主な文法項目を解説します。</p>\n<div class=\"gi\" id=\"gi1\">\n      <h3><span class=\"n\">1</span>不定詞・動名詞の両方をとれる形容詞</h3>\n<p><span class=\"lbl\">ポイント：</span>形容詞の中には、後に続くのが不定詞（to do）か動名詞（doing / of doing）かによって意味のニュアンスが変わるものがあります。<br><b>afraid to do</b>：（意志として）～する勇気がない、～するのが怖いのであえてしない。<br><b>afraid of doing</b>：（無意識に）～してしまうのではないかと心配する、～という事態を恐れる。</p>\n<div class=\"ex\">I'm <b>afraid to tell</b> my boss the truth.（上司に本当のことを言うのが怖くて、言えない／言おうと踏み出せない。）</div>\n<div class=\"ex\">I'm <b>afraid of telling</b> my boss the truth.（上司に本当のことを言ってしまうこと〔＝言った結果の事態〕が怖い・不安だ。）</div>\n<p><span class=\"lbl\">ashamed to do / ashamed of doing：</span><b>ashamed to ask</b>：（これから）聞くのが恥ずかしい（行為へのためらい。恥ずかしくて聞けない場合にも、恥ずかしいけれど聞く場合にも使う）<br><b>ashamed of asking</b>：（聞いてしまった／聞こうとしたことを）恥じている（後悔・自己評価）</p>\n<div class=\"ex\">I'm <b>ashamed to ask</b>, but could you explain it again?（恥ずかしいのですが、もう一度説明してもらえますか。）</div>\n<div class=\"ex\">I'm <b>ashamed of asking</b> so many questions in the meeting.（会議で質問しすぎたことを恥じています。）</div>\n</div>\n<div class=\"gi\" id=\"gi2\">\n      <h3><span class=\"n\">2</span>副詞の注意点</h3>\n<p><span class=\"lbl\">ポイント：</span>副詞 + 形容詞/副詞：程度を強調したり、様態を説明したりします。<br><b>highly</b> (非常に、高く)：highly skilled, highly educated など。<br><b>deeply</b> (深く)：deeply concerned, deeply moved など。<br><b>totally</b> (完全に)：totally natural, totally different など。<br><b>pretty</b> (かなり)：口語的。pretty difficult, pretty good など。</p>\n<div class=\"ex\">This product is <b>highly</b> recommended. (この製品は強く推奨されています。)</div>\n<div class=\"ex\">It is <b>totally</b> impossible to finish this by noon. (正午までにこれを終えるのは完全に不可能です。)</div>\n</div>\n<div class=\"gi\" id=\"gi3\">\n      <h3><span class=\"n\">3</span>副詞の慣用表現</h3>\n<p><span class=\"lbl\">ポイント：</span>文頭や文中で使われ、文全体の流れを整理したり、話し手の態度を示したりします。<br><b>In general</b> (一般的に言えば)<br><b>In short</b> (要するに、手短に言えば)<br><b>In my view</b> (私の考えでは) = In my opinion</p>\n<div class=\"ex\"><b>In general</b>, cats sleep more than dogs. (一般的に、猫は犬より多く眠る。)</div>\n<div class=\"ex\"><b>In short,</b> we need more money. (要するに、もっと資金が必要だ。)</div>\n</div>\n<div class=\"gi\" id=\"gi4\">\n      <h3><span class=\"n\">4</span>疑問詞を使った慣用表現</h3>\n<p><span class=\"lbl\">ポイント：</span>会話で頻繁に使われる、疑問詞を含んだ定型表現です。<br><b>Why not?</b>：「～したらどう？（提案）」「もちろん（同意）」<br><b>What if ...?</b>：「もし～ならどうなるか？（懸念・仮定）」<br><b>How come ...?</b>：「どうして～なのか？（Whyよりも口語的で、後ろは平叙文の語順）」<br><b>Who knows?</b>：「誰にもわからない（＝ひょっとすると～かもしれない）」</p>\n<div class=\"ex\"><b>Why not</b> join us? (私たちと一緒に来ない？)</div>\n<div class=\"ex\"><b>What if</b> this doesn't work?（これがうまくいかなかったらどうなる？）</div>\n<div class=\"ex\"><b>How come</b> you are here? (どうして君がここにいるの？)</div>\n<div class=\"ex\"><b>Who knows?</b> Things may change.（さあね。状況が変わるかも。）</div>\n</div>",

const KEYS = ["1", "2", "3", "4"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const STATE = {}; // lesson id -> { g:{}, r:{} }
let L = null;     // 表示中のレッスン

/* ===== 読解クイズの正解位置をばらけさせる ===== */
(function(){
  const PAT = [0, 2, 1, 3, 2, 0, 3, 1, 1, 3, 0, 2];
  LESSONS.forEach((l, li) => l.rq.forEach((q, i) => {
    const to = PAT[(li * 5 + i) % PAT.length];
    if (to === q.ans) return;
    const mv = arr => { const [x] = arr.splice(q.ans, 1); arr.splice(to, 0, x); };
    mv(q.opts); mv(q.why); q.ans = to;
  }));
})();

/* ===== Part タブ ===== */
const CHAPS = [...new Set(LESSONS.map(l => l.chapter))];
let barCh = null;
function drawBar(ch){
  if (barCh === ch) return; barCh = ch;
  $("chapbar").innerHTML = '<span class="lbl2">PART</span>' + CHAPS.map(c =>
    '<button class="ctab" type="button" data-ch="' + c + '" aria-pressed="' + (c === ch) + '">' + c + '</button>').join("");
  $("partbar").innerHTML = '<span class="lbl2">PART ' + ch + '</span>' + LESSONS.filter(l => l.chapter === ch).map(l =>
    '<button class="ptab" type="button" role="tab" data-id="' + l.id + '" aria-selected="false"><b>Lesson ' + l.id + '</b><span>' + esc(l.title) + '</span></button>').join("");
}
$("chapbar").addEventListener("click", e => {
  const b = e.target.closest(".ctab"); if (!b) return;
  const c = Number(b.dataset.ch); if (c === L.chapter) return;
  show(LESSONS.find(l => l.chapter === c).id, true);
});
$("partbar").addEventListener("click", e => {
  const b = e.target.closest(".ptab"); if (!b) return;
  show(b.dataset.id, true);
});

    <summary>${L.ja}</summary>
    <div class="tr-body">${L.trans.map(p => "<p>" + p + "</p>").join("")}</div>
  </details>
</section>

<section id="grammar">
  <div class="sec-h"><span class="ic" style="background:var(--navy)">G</span><h2>文法項目の解説</h2><span class="note">${L.grammarNote}</span></div>
  <div class="card" id="gitems">${L.grammar}</div>
</section>

<section id="gcheck">
  <div class="sec-h"><span class="ic" style="background:var(--orange)">Q</span><h2>グラマー理解度チェッククイズ</h2></div>
  <div class="card">
    <p class="lead" style="margin-top:0">${g.lead}</p>
    <div class="gbar">
      <span class="score">正解 <b id="gScore">0</b> / ${g.items.length}<span id="gDone" style="color:var(--ink-3);font-weight:500;font-size:12.5px;margin-left:6px"></span></span>
      <button class="btn" id="gShowAll" type="button">解答と解説をすべて表示</button>
      <button class="btn" id="gReset" type="button">やり直す</button>
    </div>
    <div class="gq" id="gq"></div>
    <div class="sec-h" style="margin-top:22px"><span class="ic" style="background:#C9A443">A</span><h2 style="font-size:16px">解答と解説</h2><span class="note" id="gHint"></span></div>
    <ol class="alist" id="alist"></ol>
    <details class="tr" style="margin-top:16px">
      <summary>日本語訳</summary>
      <div class="tr-body jt">${g.ja.map(p => "<p>" + p + "</p>").join("")}</div>
    </details>
  </div>
</section>

<section id="rquiz" class="wide">
  <div class="sec-h"><span class="ic" style="background:var(--green)">RQ</span><h2>読解クイズ</h2><span class="note">英検2級タイプ・4択</span></div>
  <div class="card">
    <div class="toggle-row">
      <span class="lead" style="margin:0">本文を読みながら、最も適切なものを選んでください。答えると、根拠になる文が本文の中で黄色く光ります。</span>
      <button class="switch" id="jaSwitch" type="button" aria-pressed="true"><span class="knob"></span>問題文の日本語訳</button>
    </div>
    <div class="rq-grid">
      <aside class="rq-pass" id="rqPass" aria-label="本文"><p class="rp-h">PASSAGE</p>${L.passage.map((_, i) => paraHTML(i, "p-", false)).join("")}</aside>
      <div class="rq-main">
        <div id="rqlist"></div>
        <div class="rscore"><span class="score">正解 <b id="rScore">0</b> / ${L.rq.length}</span><button class="btn" id="rReset" type="button">やり直す</button></div>
      </div>
    </div>
  </div>
</section>
${nextPartHTML()}`;
  $("foot").textContent = "Lesson " + L.id + " — " + L.title;
  document.title = "Lesson " + L.id + "｜" + L.title;
  renderGQ(); renderRQ(); restore(); setupVideo(); onScroll();
}
function nextPartHTML(){
  const i = LESSONS.indexOf(L), n = LESSONS[i + 1];
  return n ? '<div class="nextpart"><button class="btn primary" type="button" data-goto="' + n.id + '">次へ：Lesson ' + n.id + ' ' + esc(n.title) + ' →</button></div>' : "";
}

/* ===== 動画 ===== */
function setupVideo(){
  const v = $("video");
  const load = () => {
    if (v.dataset.loaded) return;
    v.dataset.loaded = "1";
    if (location.protocol === "file:") {
      v.innerHTML = '<a href="https://www.youtube.com/watch?v=' + L.yt + '" target="_blank" rel="noopener" style="position:absolute;inset:0;display:grid;place-items:center;text-decoration:none">' +
        '<img src="https://i.ytimg.com/vi/' + L.yt + '/hqdefault.jpg" alt="" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75">' +
        '<span style="position:relative;background:#e62117;color:#fff;border-radius:14px;padding:12px 22px;font-weight:700">▶ YouTube で再生</span></a>';
      return;
    }
    v.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + L.yt + '?rel=0" title="解説動画" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  };
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es, o) => { if (es.some(e => e.isIntersecting)) { load(); o.disconnect(); } }, { rootMargin: "300px" }).observe(v);
  } else load();
}

/* ===== グラマー理解度チェック ===== */
const ansLabel = a => a === "×" ? "×（冠詞なし）" : a;
function renderGQ(){
  const g = L.gcheck;
  $("gq").innerHTML = g.text.map(p => "<p>" + p.replace(/\{(\d+)\}/g, (_, n) => {
    const it = g.items[n - 1];
    return '<span class="blank" id="b' + n + '" data-n="' + n + '" role="group" aria-label="空欄' + n + '"><span class="no">(' + n + ')</span>' +
      it.opts.map(o => '<button type="button" data-o="' + esc(o) + '">' + o + '</button>').join(it.opts.length >= 2 ? '<span class="sl" aria-hidden="true">/</span>' : "") + '<span class="mark" aria-live="polite"></span></span>';
  }) + "</p>").join("");
  $("alist").innerHTML = g.items.map((q, i) => {
    const n = i + 1;
    if (q.item == null) return '<li id="a' + n + '" hidden><span class="num">' + n + '</span><div><span class="ans">正解：' + (q.label || q.a) + '<span class="res"></span></span><p class="exp">解説：' + q.exp + '</p>' + (L.gcheck.ja[i] ? '<p class="exp" style="color:var(--ink-2)">訳：' + L.gcheck.ja[i].replace(/^Q\d+\s*/, '') + '</p>' : '') + '</div></li>';
    const m = q.exp.match(/^【([^】]+)】\s*/);
    const link = m ? "【" + m[1] + "】" : "【項目" + q.item + "】";
    const body = m ? q.exp.slice(m[0].length) : q.exp;
    return '<li id="a' + n + '" hidden><span class="num">' + n + '</span><div><span class="ans">正解：' + (q.label || q.a) + '<span class="res"></span></span>' +
      '<p class="exp">解説：<button type="button" class="golink" data-item="' + q.item + '">' + link + '</button>' + body + '</p></div></li>';
  }).join("");
}
function pickG(n, o){
  const q = L.gcheck.items[n - 1], box = $("b" + n);
  STATE[L.id].g[n] = o;
  box.querySelectorAll("button").forEach(x => x.classList.toggle("pick", x.dataset.o === o));
  const ok = o === q.a;
  box.classList.toggle("ok", ok); box.classList.toggle("ng", !ok);
  box.querySelector(".mark").textContent = ok ? "○" : "×";
  const li = $("a" + n); li.hidden = false;
  const res = li.querySelector(".res");
  res.className = "res " + (ok ? "ok" : "ng");
  res.textContent = ok ? "○ 正解" : "× あなたの答え：" + ansLabel(o);
  gTally();
}
function gTally(){
  const A = STATE[L.id].g, items = L.gcheck.items;
  const done = Object.keys(A).length;
  $("gScore").textContent = Object.entries(A).filter(([n, v]) => v === items[n - 1].a).length;
  $("gDone").textContent = "（解答済み " + done + "）";
  $("gHint").textContent = done ? (L.gcheck.items.some(q => q.item != null) ? "（【項目】を押すと文法解説へ移動します）" : "") : "答えた問題の解説がここに出ます";
}

/* ===== 読解クイズ ===== */
function renderRQ(){
  $("rqlist").innerHTML = L.rq.map((q, i) =>
    '<div class="rq" id="rq' + i + '" data-q="' + i + '"><div class="qh"><span class="qn">Q' + (i + 1) + '</span><div><p class="qtext">' + q.q + '</p><p class="qja">' + q.qja + '</p></div></div>' +
    '<details class="rq-ctx" open><summary>関連パラグラフ ' + q.para.map(p => "¶" + (p + 1)).join("・") + '</summary>' + q.para.map(p => paraHTML(p, "m" + i + "-", false)).join("") + '</details>' +
    '<ul class="opts">' + q.opts.map((o, j) => '<li><button type="button" class="opt" data-q="' + i + '" data-j="' + j + '"><span class="k">' + KEYS[j] + '</span><span>' + o + '</span></button></li>').join("") + '</ul>' +
    '<div class="fb" id="fb' + i + '" hidden></div></div>').join("");
  if (!jaOn) $("rqlist").classList.add("hide-ja");
  $("jaSwitch").setAttribute("aria-pressed", String(jaOn));
  curQ = -1; pickQ();
}
let curQ = -1, jaOn = true;
function focusQ(i){
  if (i === curQ || !L.rq[i]) return;
  curQ = i;
  const paras = L.rq[i].para, pass = $("rqPass");
  pass.classList.toggle("focus", paras.length < L.passage.length);
  pass.querySelectorAll(".rp-para").forEach(el => el.classList.toggle("cur", paras.includes(Number(el.dataset.p))));
  const first = pass.querySelector('.rp-para[data-p="' + paras[0] + '"]');
  if (first && getComputedStyle(pass).display !== "none") pass.scrollTo({ top: first.offsetTop - pass.offsetTop - 8, behavior: "smooth" });
}
function pickQ(){
  const list = $("rqlist"); if (!list) return;
  let best = 0;
  [...list.querySelectorAll(".rq")].forEach((b, i) => { if (b.getBoundingClientRect().top < innerHeight * 0.45) best = i; });
  focusQ(best);
}
function showEvidence(i, scroll){
  const q = L.rq[i], pass = $("rqPass");
  document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev"));
  q.ev.forEach(id => ["p-", "m" + i + "-"].forEach(pre => {
    const e = $(pre + id); if (e) { void e.offsetWidth; e.classList.add("ev"); }
  }));
  curQ = -1; focusQ(i);
  if (!scroll) return;
  const side = $("p-" + q.ev[0]);
  if (side && getComputedStyle(pass).display !== "none") pass.scrollTo({ top: side.offsetTop - pass.offsetTop - 60, behavior: "smooth" });
  else { const ctx = document.querySelector("#rq" + i + " .rq-ctx"); if (ctx) ctx.open = true; }
}
function answerR(i, j, scroll){
  const q = L.rq[i];
  STATE[L.id].r[i] = j;
  $("rq" + i).querySelectorAll(".opt").forEach((x, k) => {
    x.disabled = true;
    if (k === q.ans) x.classList.add("correct");
    else if (k === j) x.classList.add("wrong");
  });
  const ok = j === q.ans;
  const evText = q.ev.map(id => $(id).textContent).join(" ");
  const fb = $("fb" + i);
  fb.innerHTML =
    '<p class="v ' + (ok ? "ok" : "ng") + '">' + (ok ? "◎ 正解！" : "× 不正解　正解は " + KEYS[q.ans]) + '</p>' +
    '<div class="evid"><span class="en">' + evText + '</span><span class="ja">' + q.evja + '</span></div>' +
    '<button type="button" class="golink toev" data-q="' + i + '">本文で根拠の文をもう一度光らせる</button>' +
    '<ul>' + q.why.map((w, k) => '<li class="' + (k === q.ans ? "right" : "") + '"><span class="k">' + KEYS[k] + '</span>' + w + '</li>').join("") + '</ul>';
  fb.hidden = false;
  if (scroll) showEvidence(i, true);
  rTally();
}
function rTally(){
  $("rScore").textContent = Object.entries(STATE[L.id].r).filter(([i, j]) => L.rq[i].ans === j).length;
}

/* ===== 状態の復元（Part を行き来しても答えが残る） ===== */
function restore(){
  const S = STATE[L.id];
  Object.entries(S.g).forEach(([n, o]) => pickG(Number(n), o));
  Object.entries(S.r).forEach(([i, j]) => answerR(Number(i), j, false));
  gTally(); rTally();
}

/* ===== クリック（画面全体で受ける） ===== */
document.addEventListener("click", e => {
  const t = e.target;
  let b;
  if ((b = t.closest(".nav a"))) { e.preventDefault(); const s = document.querySelector(b.getAttribute("href")); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if ((b = t.closest("[data-goto]"))) { show(b.dataset.goto, true); return; }
  if ((b = t.closest(".blank button"))) { pickG(Number(b.closest(".blank").dataset.n), b.dataset.o); return; }
  if ((b = t.closest(".alist .golink"))) {
    const el = $("gi" + b.dataset.item); if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 2200);
    return;
  }
  if ((b = t.closest(".toev"))) { showEvidence(Number(b.dataset.q), true); return; }
  if ((b = t.closest(".opt"))) { if (!b.disabled) answerR(Number(b.dataset.q), Number(b.dataset.j), true); return; }
  if ((b = t.closest(".rate button"))) {
    $("aud").playbackRate = Number(b.dataset.r);
    document.querySelectorAll(".rate button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    return;
  }
  if (t.closest("#gpSwitch")) {
    const s = $("gpSwitch"), on = s.getAttribute("aria-pressed") !== "true";
    s.setAttribute("aria-pressed", String(on)); $("passage").classList.toggle("show-gp", on); return;
  }
  if (t.closest("#jaSwitch")) {
    jaOn = !jaOn; $("jaSwitch").setAttribute("aria-pressed", String(jaOn)); $("rqlist").classList.toggle("hide-ja", !jaOn); return;
  }
  if (t.closest("#gShowAll")) { $("alist").querySelectorAll("li").forEach(li => li.hidden = false); $("gHint").textContent = L.gcheck.items.some(q => q.item != null) ? "（【項目】を押すと文法解説へ移動します）" : ""; return; }
  if (t.closest("#gReset")) { STATE[L.id].g = {}; renderGQ(); gTally(); return; }
  if (t.closest("#rReset")) { STATE[L.id].r = {}; renderRQ(); rTally(); document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev")); return; }
});
document.addEventListener("focusin", e => { const b = e.target.closest && e.target.closest(".rq"); if (b) focusQ(Number(b.dataset.q)); });

/* ===== Part の表示 ===== */
function show(id, scrollTop){
  const next = LESSONS.find(l => l.id === id) || LESSONS[0];
  const a = $("aud"); if (a) a.pause();
  L = next;
  STATE[L.id] = STATE[L.id] || { g: {}, r: {} };
  drawBar(L.chapter);
  document.querySelectorAll(".ptab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === L.id)));
  render();
  try { history.replaceState(null, "", "#part-" + L.id); } catch (e) {}
  if (scrollTop) scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

/* ===== ナビの現在地 ===== */
function onScroll(){
  const links = [...document.querySelectorAll(".nav a")];
  let cur = 0;
  links.forEach((a, i) => { const s = document.querySelector(a.getAttribute("href")); if (s && s.getBoundingClientRect().top < 120) cur = i; });
  links.forEach((a, i) => a.classList.toggle("on", i === cur));
  pickQ();
}
addEventListener("scroll", onScroll, { passive: true });

/* ===== テーマ ===== */
const themeBtn = $("themeBtn");
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "ライト" : "ダーク";
  themeBtn.setAttribute("aria-pressed", String(t === "dark"));
  try { localStorage.setItem("rd-theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("rd-theme"); } catch (e) {}
setTheme(saved || "light");
themeBtn.addEventListener("click", () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ===== 起動 ===== */
let start = LESSONS[0].id;
try { const h = location.hash.match(/^#part-(.+)$/); if (h && LESSONS.some(l => l.id === h[1])) start = h[1]; } catch (e) {}
show(start, false);
</script>
</body>
</html>
